<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Quản lý danh mục truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .admin-header-waka {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
        .btn-add-waka {
            background: #16a085;
            color: #fff;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-add-waka:hover {
            background: #1abc9c;
            color: #fff;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='categories')}"></div>
        </div>

        <!-- Main Content -->
        <div th:class="${#authorization.expression('hasAnyRole(''ADMIN'',''LIBRARIAN'')')} ? 'col-md-9 col-lg-10 px-5' : 'col-md-8 mx-auto px-5'">
            <div class="admin-header-waka">
                <h3 class="mb-0">Quản lý danh mục truyện</h3>
                <div sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a th:href="@{/categories/add}" class="btn-add-waka">
                        <i class="bi bi-plus-circle me-2"></i>Thêm danh mục
                    </a>
                </div>
            </div>

            <!-- Table Area -->
            <div class="table-responsive">
                <table class="table table-waka">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Danh Mục</th>
                            <th>Số lượng truyện</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.id}" class="text-secondary"></td>
                            <td class="fw-bold text-light" th:text="${category.categoryName}"></td>
                            <td>
                                <span class="badge bg-dark border border-info text-info" th:text="${category.books != null ? category.books.size() : 0}"></span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')"
                                       th:href="@{/categories/edit/{id}(id=${category.id})}"
                                       class="btn btn-outline-warning btn-sm rounded-pill px-3 me-2">Sửa</a>
                                    <a sec:authorize="hasRole('ADMIN')"
                                       th:href="@{/categories/delete/{id}(id=${category.id})}"
                                       class="btn btn-outline-danger btn-sm rounded-pill px-3"
                                       onclick="return confirm('Xóa danh mục này?')">Xóa</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="4" class="text-center py-5 text-secondary">
                                Không có danh mục nào. <a th:href="@{/categories/add}" class="text-info">Tạo danh mục mới</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

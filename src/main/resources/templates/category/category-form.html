<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thêm/Sửa Danh Mục</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='categories')}"></div>
        </div>

        <!-- FORM DANH MỤC -->
        <div th:class="${#authorization.expression('hasAnyRole(''ADMIN'',''LIBRARIAN'')')} ? 'col-md-9 col-lg-10' : 'col-md-8 mx-auto'">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-collection me-2"></i>
                        <span th:if="${category.id == null}">Thêm Danh Mục Mới</span>
                        <span th:if="${category.id != null}">Sửa Danh Mục</span>
                    </h4>
                </div>

                <div class="card-body p-4">
                    <!-- Form -->
                    <form th:action="${category.id == null ? '/categories/save' : '/categories/update/' + category.id}"
                          th:object="${category}" method="post" class="row g-3">

                        <div class="col-md-8">
                            <label class="form-label fw-bold">Tên Danh Mục <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-collection"></i></span>
                                <input type="text" th:field="*{categoryName}" class="form-control"
                                       placeholder="Nhập tên danh mục (VD: Xuyên không, Tu tiên...)"
                                       required>
                            </div>
                            <small class="text-muted d-block mt-1">
                                <i class="bi bi-info-circle me-1"></i>Tên danh mục phải ít nhất 1 ký tự
                            </small>
                        </div>

                        <div class="col-md-8 mt-4">
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-save me-2"></i>
                                    <span th:if="${category.id == null}">Thêm Danh Mục</span>
                                    <span th:if="${category.id != null}">Lưu Thay Đổi</span>
                                </button>
                                <a th:href="@{/categories}" class="btn btn-outline-secondary px-5">
                                    <i class="bi bi-arrow-left me-2"></i>Quay Lại
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

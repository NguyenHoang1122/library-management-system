<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thông báo | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/my-notifications.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='notifications')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0 text-white fw-bold">Thông báo</h3>
                <div th:if="${totalNotifications > 0}">
                    <form th:action="@{/my-notifications/mark-all-read}" method="post" class="d-inline">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-success btn-sm rounded-pill px-3 me-2"><i class="bi bi-check-all me-1"></i>Đọc tất cả</button>
                    </form>
                    <form th:action="@{/my-notifications/delete-read}" method="post" class="d-inline delete-read-form">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 btn-delete-read-page"><i class="bi bi-trash-fill me-1"></i>Xóa đã đọc</button>
                    </form>
                </div>
            </div>

            <!-- Content Area -->
            <div th:if="${totalNotifications == 0}" class="text-center py-5">
                <i class="bi bi-bell-slash" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary fs-5">Bạn không có thông báo nào.</p>
            </div>

            <div class="noti-list-waka" th:if="${totalNotifications > 0}">
                <div th:each="notification : ${notifications}" class="noti-item-waka" th:classappend="${!notification.read ? 'unread' : ''}">
                    <!-- Left: Clickable Notification Content -->
                    <a th:href="@{/my-notifications/{id}(id=${notification.id})}" class="d-flex flex-column gap-1 flex-grow-1 me-3 text-decoration-none">
                        <h6 class="mb-1" th:classappend="${!notification.read ? 'text-light fw-bold' : 'text-secondary'}">
                            <span th:if="${!notification.read}" class="unread-dot"></span>
                            <span th:text="${notification.title}">Tiêu đề</span>
                        </h6>
                        <p class="mb-2 text-secondary small" th:text="${notification.content}">Nội dung...</p>
                        <span class="noti-time">
                            <i class="bi bi-calendar-event me-1"></i>
                            <span th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                        </span>
                    </a>
                    
                    <!-- Right: Quick actions -->
                    <div class="d-flex gap-3 align-items-center">
                        <form th:if="${!notification.read}" th:action="@{/my-notifications/{id}/mark-read(id=${notification.id})}" method="post" class="m-0">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-link text-success p-0" title="Đánh dấu đã đọc"><i class="bi bi-check2-circle fs-4"></i></button>
                        </form>
                        <form th:action="@{/my-notifications/{id}/delete(id=${notification.id})}" method="post" class="m-0 delete-single-form">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-link text-danger p-0 btn-delete-single" title="Xóa thông báo"><i class="bi bi-trash fs-4"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/my-notifications.js}"></script>
</body>
</html>

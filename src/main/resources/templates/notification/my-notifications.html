<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thông báo</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .notification-item {
            border-left: 4px solid #0d6efd;
            transition: all 0.3s ease;
        }
        .notification-item:hover {
            background-color: #f8f9fa;
            transform: translateX(3px);
        }
        .notification-item.unread {
            background-color: #e7f3ff;
            border-left-color: #0dcaf0;
        }
        .notification-time {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .unread-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #0dcaf0;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='notifications')}"></div>
        </div>

        <!-- NOTIFICATIONS CONTENT -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-bell"></i> Thông báo
                        <span class="badge bg-danger ms-2" th:text="${unreadCount}"></span>
                    </h3>
                    <div th:if="${unreadCount > 0}">
                        <form th:action="@{/my-notifications/mark-all-read}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-primary me-2">
                                <i class="bi bi-check-all"></i> Đánh dấu tất cả đã đọc
                            </button>
                        </form>
                        <form th:action="@{/my-notifications/delete-all}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa tất cả thông báo?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Xóa tất cả
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Danh sách thông báo -->
                    <div th:if="${totalNotifications > 0}">
                        <!-- Chưa đọc -->
                        <div th:if="${!unreadNotifications.isEmpty()}">
                            <h5 class="mb-3 text-secondary">
                                <i class="bi bi-dot"></i> Chưa đọc
                            </h5>
                            <div th:each="notification : ${unreadNotifications}" class="list-group mb-4">
                                <a th:href="@{/my-notifications/{id}(id=${notification.id})}"
                                   class="list-group-item notification-item unread d-flex justify-content-between align-items-start">
                                    <div class="ms-2 me-auto">
                                        <h6 class="mb-1">
                                            <span class="unread-badge"></span>
                                            <span th:text="${notification.title}"></span>
                                        </h6>
                                        <p class="mb-1 text-muted" th:text="${notification.content}"></p>
                                        <span class="notification-time"
                                              th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <form th:action="@{/my-notifications/{id}/mark-read(id=${notification.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-info"
                                                    title="Đánh dấu đã đọc">
                                                <i class="bi bi-check"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/my-notifications/{id}/delete(id=${notification.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Xóa thông báo này?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                    title="Xóa">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </a>
                            </div>
                        </div>

                        <!-- Đã đọc -->
                        <div th:if="${notifications.size() > unreadNotifications.size()}">
                            <h5 class="mb-3 text-secondary">
                                <i class="bi bi-check2"></i> Đã đọc
                            </h5>
                            <div class="list-group">
                                <a th:each="notification : ${notifications}"
                                   th:if="${notification.isRead()}"
                                   th:href="@{/my-notifications/{id}(id=${notification.id})}"
                                   class="list-group-item notification-item d-flex justify-content-between align-items-start">
                                    <div class="ms-2 me-auto">
                                        <h6 class="mb-1" th:text="${notification.title}"></h6>
                                        <p class="mb-1 text-muted" th:text="${notification.content}"></p>
                                        <span class="notification-time"
                                              th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                    <form th:action="@{/my-notifications/{id}/delete(id=${notification.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Xóa thông báo này?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Danh sách trống -->
                    <div th:if="${totalNotifications == 0}" class="text-center py-5">
                        <i class="bi bi-bell-slash" style="font-size: 3rem; color: #adb5bd;"></i>
                        <p class="text-muted mt-3">Bạn không có thông báo nào</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

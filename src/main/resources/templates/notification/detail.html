<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Chi tiết thông báo</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .notification-content {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
            line-height: 1.8;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='notifications')}"></div>
        </div>

        <!-- DETAIL CONTENT -->
        <div class="col-md-9 col-lg-10">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/my-notifications}">Thông báo</a></li>
                    <li class="breadcrumb-item active" th:text="${notification.title}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-bell-fill"></i> <span th:text="${notification.title}"></span>
                    </h3>
                    <span th:if="${!notification.isRead()}" class="badge bg-info">Chưa đọc</span>
                </div>

                <div class="card-body p-4">
                    <!-- Ngày giờ -->
                    <div class="mb-4 text-muted">
                        <i class="bi bi-calendar-event"></i>
                        <span th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>

                    <!-- Nội dung -->
                    <div class="notification-content mb-4">
                        <p th:text="${notification.content}"></p>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-between gap-2">
                        <div>
                            <a th:href="@{/my-notifications}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Quay lại
                            </a>
                        </div>
                        <div>
                            <form th:action="@{/my-notifications/{id}/delete(id=${notification.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Xóa thông báo này?')">
                                <button type="submit" class="btn btn-outline-danger">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

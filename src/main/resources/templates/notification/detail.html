<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Chi tiết thông báo</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/notification-detail.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='notifications')}"></div>
        </div>

        <!-- DETAIL CONTENT -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/my-notifications}">Thông báo</a></li>
                    <li class="breadcrumb-item active" th:text="${notification.title}"></li>
                </ol>
            </nav>

            <div class="card card-detail-waka shadow-lg">
                <div class="card-header bg-transparent border-bottom border-secondary border-opacity-10 py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-white fw-bold">
                        <i class="bi bi-bell-fill text-warning me-2"></i> <span th:text="${notification.title}"></span>
                    </h3>
                    <span th:if="${!notification.isRead()}" class="badge bg-danger rounded-pill px-3 py-2">Chưa đọc</span>
                    <span th:if="${notification.isRead()}" class="badge bg-secondary rounded-pill px-3 py-2">Đã đọc</span>
                </div>

                <div class="card-body p-4">
                    <!-- Ngày giờ -->
                    <div class="mb-4 text-secondary small d-flex align-items-center gap-2">
                        <i class="bi bi-calendar-event text-warning"></i>
                        Gửi lúc: <span th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>

                    <!-- Nội dung -->
                    <div class="notification-content-dark mb-4">
                        <p class="mb-0" th:text="${notification.content}"></p>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a th:href="@{/my-notifications}" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>
                        <form th:action="@{/my-notifications/{id}/delete(id=${notification.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Xóa thông báo này?')">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-danger rounded-pill px-4">
                                <i class="bi bi-trash me-1"></i> Xóa
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

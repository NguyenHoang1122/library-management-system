<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Common Sidebar</title>
</head>
<body>

<!-- SIDEBAR CHUNG - TỰ ĐỘNG HIỂN THỊ THEO ROLE ĐANG ĐĂNG NHẬP -->
<div th:fragment="common_sidebar(activePage)" class="common-sidebar">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-primary">
                <i class="bi bi-speedometer2"></i>
                <span sec:authorize="hasRole('ADMIN')">Admin Panel</span>
                <span sec:authorize="hasRole('LIBRARIAN')">Librarian Panel</span>
                <span sec:authorize="hasRole('USER')">Menu Cá Nhân</span>
            </h5>
        </div>

        <div class="list-group list-group-flush">

            <!-- ========== MENU CHUNG CHO TẤT CẢ ROLE ========== -->
            <a th:href="@{/user/profile}"
               class="list-group-item list-group-item-action d-flex align-items-center"
               th:classappend="${activePage == 'profile' ? 'active' : ''}">
                <i class="bi bi-person me-3"></i>
                <span>Hồ sơ cá nhân</span>
            </a>

            <!-- ========== MENU CHO ADMIN ========== -->
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/user}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'users' ? 'active' : ''}">
                    <i class="bi bi-people me-3"></i>
                    <span>Quản lý người dùng</span>
                </a>

                <a th:href="@{/categories}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'categories' ? 'active' : ''}">
                    <i class="bi bi-collection me-3"></i>
                    <span>Danh mục sách</span>
                </a>

                <a th:href="@{/books}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'books' ? 'active' : ''}">
                    <i class="bi bi-book me-3"></i>
                    <span>Quản lý sách</span>
                </a>

                <a th:href="@{/user/trash}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'trash' ? 'active' : ''}">
                    <i class="bi bi-trash me-3"></i>
                    <span>Thùng rác</span>
                </a>

                <a th:href="@{/admin/reports}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'reports' ? 'active' : ''}">
                    <i class="bi bi-graph-up me-3"></i>
                    <span>Báo cáo thống kê</span>
                </a>
            </div>

            <!-- ========== MENU CHO LIBRARIAN ========== -->
            <div sec:authorize="hasRole('LIBRARIAN')">
                <a th:href="@{/librarian/borrows}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'borrows' ? 'active' : ''}">
                    <i class="bi bi-arrow-left-right me-3"></i>
                    <span>Yêu cầu mượn</span>
                </a>

                <a th:href="@{/librarian/books}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'books' ? 'active' : ''}">
                    <i class="bi bi-book me-3"></i>
                    <span>Quản lý sách</span>
                </a>

                <a th:href="@{/librarian/returns}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'returns' ? 'active' : ''}">
                    <i class="bi bi-arrow-counterclockwise me-3"></i>
                    <span>Quản lý trả sách</span>
                </a>

                <a th:href="@{/librarian/members}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'members' ? 'active' : ''}">
                    <i class="bi bi-people-fill me-3"></i>
                    <span>Danh sách thành viên</span>
                </a>
            </div>

            <!-- ========== MENU CHO USER ========== -->
            <div sec:authorize="hasRole('USER')">
                <a th:href="@{/books}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'books' ? 'active' : ''}">
                    <i class="bi bi-book me-3"></i>
                    <span>Trang sách</span>
                </a>

                <a th:href="@{/my-borrows}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'myborrows' ? 'active' : ''}">
                    <i class="bi bi-bookmark me-3"></i>
                    <span>Lịch sử mượn sách</span>
                </a>

                <a th:href="@{/my-wishlist}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'wishlist' ? 'active' : ''}">
                    <i class="bi bi-heart me-3"></i>
                    <span>Danh sách yêu thích</span>
                </a>

                <a th:href="@{/my-notifications}"
                   class="list-group-item list-group-item-action d-flex align-items-center"
                   th:classappend="${activePage == 'notifications' ? 'active' : ''}">
                    <i class="bi bi-bell me-3"></i>
                    <span>Thông báo</span>
                </a>
            </div>

            <!-- ========== ĐĂNG XUẤT (CHUNG) ========== -->
            <hr class="my-2">
            <form th:action="@{/logout}" method="post" class="px-3">
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Đăng xuất
                </button>
            </form>

        </div>
    </div>
</div>

<!-- CSS cho Common Sidebar -->
<style th:fragment="sidebar_styles">
    .common-sidebar .list-group-item {
        border: none;
        border-bottom: 1px solid #f0f0f0;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }

    .common-sidebar .list-group-item:hover {
        background-color: #f8f9fa;
        transform: translateX(3px);
    }

    .common-sidebar .list-group-item.active {
        background-color: #0d6efd;
        color: white;
        border-color: #0d6efd;
    }

    .common-sidebar .list-group-item.active i {
        color: white;
    }

    .common-sidebar .list-group-item:last-child {
        border-bottom: none;
    }
</style>

</body>
</html>

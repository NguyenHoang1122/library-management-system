<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Quản Lý Danh Mục Sách</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='categories')}"></div>
        </div>

        <!-- DANH SÁCH DANH MỤC -->
        <div th:class="${#authorization.expression('hasAnyRole(''ADMIN'',''LIBRARIAN'')')} ? 'col-md-9 col-lg-10' : 'col-md-8 mx-auto'">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary"><i class="bi bi-collection"></i> Quản Lý Danh Mục Sách</h3>
                    <!-- Nút thêm danh mục -->
                    <div sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                        <a th:href="@{/categories/add}" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Thêm danh mục
                        </a>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo thành công/lỗi -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-octagon me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Bảng danh sách -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tên Danh Mục</th>
                                <th>Số Sách</th>
                                <th class="text-center">Hành Động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="category : ${categories}">
                                <td th:text="${category.id}" class="fw-bold text-muted"></td>
                                <td th:text="${category.categoryName}" class="fw-bold"></td>
                                <td>
                                    <span class="badge bg-primary" th:text="${category.books != null ? category.books.size() : 0}"></span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')"
                                           th:href="@{/categories/edit/{id}(id=${category.id})}"
                                           class="btn btn-outline-warning btn-sm" title="Sửa">
                                            <i class="bi bi-pencil"></i> Sửa
                                        </a>
                                        <a sec:authorize="hasRole('ADMIN')"
                                           th:href="@{/categories/delete/{id}(id=${category.id})}"
                                           class="btn btn-outline-danger btn-sm"
                                           onclick="return confirm('Bạn có chắc muốn xóa danh mục này?')" title="Xóa">
                                            <i class="bi bi-trash"></i> Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- Nếu danh sách trống -->
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-4 text-muted">
                                    Không có danh mục nào. <a th:href="@{/categories/add}" class="text-primary">Tạo danh mục mới</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

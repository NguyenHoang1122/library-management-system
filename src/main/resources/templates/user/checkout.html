<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <title>Thanh Toán Đơn Mượn | Truyện 360</title>
</head>

<body>
    <header th:replace="~{layout :: header}"></header>

    <div class="container my-5" style="min-height: 60vh;">
        <h2 class="mb-4 text-center fw-bold text-success"><i class="bi bi-credit-card me-2"></i>Thanh Toán Đơn Mượn</h2>

        <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}">Lỗi xảy ra</div>

        <form th:action="@{/checkout}" method="post" id="checkoutForm">
            <div class="row">
                <!-- Cột trái: Thông tin giao hàng -->
                <div class="col-lg-7">
                    <div class="card shadow-sm border-0 rounded-3 mb-4 cart-card">
                        <div class="card-header border-bottom border-dark py-3">
                            <h5 class="mb-0 fw-bold text-info"><i class="bi bi-truck me-2"></i>Hình thức nhận truyện</h5>
                        </div>
                        <div class="card-body text-light">
                            
                            <div class="form-check border border-secondary p-3 rounded mb-3" style="background-color: #222;">
                                <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryPickup" value="PICKUP" checked>
                                <label class="form-check-label fw-medium w-100 cursor-pointer" for="deliveryPickup">
                                    Nhận trực tiếp tại thư viện
                                    <small class="d-block text-secondary mt-1">Đến địa chỉ Thư viện Truyện 360 để nhận sách. (Không mất phí vận chuyển)</small>
                                </label>
                            </div>

                            <div class="form-check border border-secondary p-3 rounded mb-3" style="background-color: #222;">
                                <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryShipping" value="SHIPPING">
                                <label class="form-check-label fw-medium w-100 cursor-pointer" for="deliveryShipping">
                                    Giao hàng tận nơi
                                    <small class="d-block text-secondary mt-1">Sách sẽ được giao đến địa chỉ của bạn. Phí ship tính theo khoảng cách.</small>
                                </label>
                            </div>

                            <!-- Địa chỉ giao hàng mặc định -->
                            <div id="defaultAddressSection" class="mt-3 p-3 border border-secondary rounded shadow-sm" style="display: none; background-color: #222;">
                                <h6 class="fw-bold mb-2 text-info">Giao đến địa chỉ mặc định:</h6>
                                <p class="mb-3 text-secondary small"><i class="bi bi-geo-alt-fill me-1 text-danger"></i> <span th:text="${user.address}" class="text-light"></span></p>
                                <input type="hidden" id="defaultUserAddress" th:value="${user.address}">
                                
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="useDifferentAddress">
                                    <label class="form-check-label fw-medium small text-light" for="useDifferentAddress">
                                        Giao đến địa chỉ khác
                                    </label>
                                </div>
                            </div>

                            <!-- Phần nhập địa chỉ (ẩn đi mặc định) -->
                            <div id="addressSection" class="mt-3 p-3 border border-secondary rounded shadow-sm" style="display: none; background-color: #222;">
                                <h6 class="fw-bold mb-3 text-info">Nhập địa chỉ mới</h6>
                                
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small text-secondary">Tỉnh/Thành phố</label>
                                        <select id="city" class="form-select bg-dark text-light border-secondary" required disabled>
                                            <option value="" selected>Chọn Tỉnh/Thành</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-secondary">Quận/Huyện</label>
                                        <select id="district" class="form-select bg-dark text-light border-secondary" required disabled>
                                            <option value="" selected>Chọn Quận/Huyện</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-secondary">Phường/Xã</label>
                                        <select id="ward" class="form-select bg-dark text-light border-secondary" required disabled>
                                            <option value="" selected>Chọn Phường/Xã</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small text-secondary">Số nhà, Tên đường, Tòa nhà</label>
                                        <input type="text" id="streetAddress" class="form-control bg-dark text-light border-secondary" placeholder="Ví dụ: Số 12, Ngõ 100, Đường ABC..." disabled>
                                    </div>
                                </div>
                                <input type="hidden" name="shippingAddress" id="fullShippingAddress">
                                
                                <div class="mt-3 text-end">
                                    <button type="button" id="btnCalcShipping" class="btn btn-sm btn-outline-info" disabled>Tính phí ship</button>
                                </div>
                                <div id="shippingResult" class="mt-2 text-end text-success fw-bold small" style="display:none;"></div>
                            </div>

                            <div class="mt-4">
                                <label class="form-label fw-bold text-info">Ghi chú thêm</label>
                                <textarea name="note" class="form-control bg-dark text-light border-secondary" rows="2" placeholder="Ghi chú thời gian nhận sách hoặc các yêu cầu khác..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Tóm tắt đơn hàng -->
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0 rounded-3 sticky-top summary-card">
                        <div class="card-header border-bottom border-dark py-3">
                            <h5 class="mb-0 fw-bold text-success"><i class="bi bi-receipt me-2"></i>Tóm tắt đơn hàng</h5>
                        </div>
                        <div class="card-body text-light">
                            
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2 border-dark" style="background-color: transparent;" th:each="item : ${cart.items}">
                                    <div class="d-flex align-items-center">
                                        <span class="badge bg-secondary rounded-pill me-2" th:text="${item.quantity}">1</span>
                                        <span class="text-truncate text-light" style="max-width: 200px;" th:text="${item.book.title}">Tên sách</span>
                                    </div>
                                    <span class="text-secondary small" th:text="${#numbers.formatDecimal((item.book.depositPrice != null ? item.book.depositPrice : 0) * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </li>
                            </ul>

                            <hr class="border-secondary">
                            
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary">Tổng tiền cọc:</span>
                                <span class="fw-medium" id="displayDeposit" th:attr="data-deposit=${totalDeposit}" th:text="${#numbers.formatDecimal(totalDeposit, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>
                            
                            <div class="d-flex justify-content-between mb-3" id="shippingFeeRow" style="display: none !important;">
                                <span class="text-secondary">Phí giao hàng:</span>
                                <span class="fw-medium text-warning" id="displayShippingFee" th:attr="data-default-fee=${shippingFee != null ? shippingFee : 0}">0 đ</span>
                            </div>

                            <hr class="border-secondary">

                            <div class="d-flex justify-content-between mb-4">
                                <span class="fw-bold fs-5 text-light">Tổng thanh toán:</span>
                                <span class="fw-bold text-success fs-4" id="displayTotal" th:text="${#numbers.formatDecimal(totalDeposit, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-3 fw-bold text-uppercase rounded-3 shadow">
                                XÁC NHẬN MƯỢN TRUYỆN <i class="bi bi-check-circle ms-2"></i>
                            </button>
                            <a th:href="@{/cart}" class="btn btn-outline-secondary w-100 mt-2">Quay lại giỏ hàng</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const deliveryPickup = document.getElementById('deliveryPickup');
            const deliveryShipping = document.getElementById('deliveryShipping');
            const addressSection = document.getElementById('addressSection');
            
            const citySelect = document.getElementById('city');
            const districtSelect = document.getElementById('district');
            const wardSelect = document.getElementById('ward');
            const streetAddress = document.getElementById('streetAddress');
            const fullShippingAddress = document.getElementById('fullShippingAddress');
            const btnCalcShipping = document.getElementById('btnCalcShipping');
            
            const shippingFeeRow = document.getElementById('shippingFeeRow');
            const displayShippingFee = document.getElementById('displayShippingFee');
            const displayDeposit = document.getElementById('displayDeposit');
            const displayTotal = document.getElementById('displayTotal');
            
            const defaultAddressSection = document.getElementById('defaultAddressSection');
            const useDifferentAddress = document.getElementById('useDifferentAddress');
            const defaultUserAddress = document.getElementById('defaultUserAddress').value;
            
            let depositAmount = parseFloat(displayDeposit.getAttribute('data-deposit'));
            let defaultShippingFee = parseFloat(displayShippingFee.getAttribute('data-default-fee'));
            let currentShippingFee = 0;

            // Toggle Address Section
            function toggleAddressSection() {
                if (deliveryShipping.checked) {
                    defaultAddressSection.style.display = 'block';
                    shippingFeeRow.style.setProperty('display', 'flex', 'important');
                    
                    if (useDifferentAddress.checked) {
                        addressSection.style.display = 'block';
                        citySelect.disabled = false;
                        streetAddress.disabled = false;
                        
                        // Use calculated fee from new address
                        currentShippingFee = parseFloat(displayShippingFee.getAttribute('data-calculated-fee')) || 0;
                    } else {
                        addressSection.style.display = 'none';
                        citySelect.disabled = true;
                        districtSelect.disabled = true;
                        wardSelect.disabled = true;
                        streetAddress.disabled = true;
                        fullShippingAddress.value = defaultUserAddress; // use default address
                        
                        // Use default shipping fee
                        currentShippingFee = defaultShippingFee;
                        document.getElementById('shippingResult').style.display = 'none';
                    }
                    
                    displayShippingFee.innerText = new Intl.NumberFormat('vi-VN').format(currentShippingFee) + ' đ';
                    updateTotal();
                } else {
                    defaultAddressSection.style.display = 'none';
                    addressSection.style.display = 'none';
                    citySelect.disabled = true;
                    districtSelect.disabled = true;
                    wardSelect.disabled = true;
                    streetAddress.disabled = true;
                    shippingFeeRow.style.setProperty('display', 'none', 'important');
                    fullShippingAddress.value = '';
                    
                    currentShippingFee = 0;
                    displayShippingFee.innerText = '0 đ';
                    updateTotal();
                }
            }

            deliveryPickup.addEventListener('change', toggleAddressSection);
            deliveryShipping.addEventListener('change', toggleAddressSection);
            useDifferentAddress.addEventListener('change', toggleAddressSection);

            function updateTotal() {
                let total = depositAmount + currentShippingFee;
                displayTotal.innerText = new Intl.NumberFormat('vi-VN').format(total) + ' đ';
            }

            // Fetch Provinces API
            axios.get('https://provinces.open-api.vn/api/?depth=3')
                .then(response => {
                    renderCity(response.data);
                })
                .catch(error => console.error("Error fetching provinces", error));

            function renderCity(data) {
                for (const x of data) {
                    citySelect.options[citySelect.options.length] = new Option(x.name, x.name);
                }
                
                citySelect.onchange = function() {
                    districtSelect.length = 1;
                    wardSelect.length = 1;
                    districtSelect.disabled = false;
                    wardSelect.disabled = true;
                    checkCalcButton();
                    
                    if(this.value !== "") {
                        const result = data.filter(n => n.name === this.value);
                        for (const k of result[0].districts) {
                            districtSelect.options[districtSelect.options.length] = new Option(k.name, k.name);
                        }
                    }
                };

                districtSelect.onchange = function() {
                    wardSelect.length = 1;
                    wardSelect.disabled = false;
                    checkCalcButton();
                    
                    const dataCity = data.filter(n => n.name === citySelect.value);
                    if (this.value !== "") {
                        const dataWards = dataCity[0].districts.filter(n => n.name === this.value)[0].wards;
                        for (const w of dataWards) {
                            wardSelect.options[wardSelect.options.length] = new Option(w.name, w.name);
                        }
                    }
                };
                
                wardSelect.onchange = checkCalcButton;
                streetAddress.oninput = checkCalcButton;
            }
            
            function checkCalcButton() {
                if (citySelect.value && districtSelect.value && wardSelect.value && streetAddress.value.trim() !== '') {
                    btnCalcShipping.disabled = false;
                    let fullAddress = `${streetAddress.value}, ${wardSelect.value}, ${districtSelect.value}, ${citySelect.value}`;
                    fullShippingAddress.value = fullAddress;
                } else {
                    btnCalcShipping.disabled = true;
                }
            }

            // Calculate Shipping
            btnCalcShipping.addEventListener('click', function() {
                const csrfMeta = document.querySelector('meta[name="_csrf"]');
                const csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : '';
                const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
                const csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : '';
                
                let address = fullShippingAddress.value;
                if (!address) return;
                
                btnCalcShipping.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang tính...';
                
                const formData = new URLSearchParams();
                formData.append('address', address);

                const headers = {
                    'Content-Type': 'application/x-www-form-urlencoded'
                };
                if (csrfHeader && csrfToken) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch('/checkout/calculate-fee', {
                    method: 'POST',
                    headers: headers,
                    body: formData.toString()
                })
                .then(response => response.json())
                .then(data => {
                    btnCalcShipping.innerHTML = 'Tính phí ship';
                    if (data.error) {
                        Swal.fire('Lỗi', data.error, 'error');
                        document.getElementById('shippingResult').innerText = "Không thể tính phí ship. Vui lòng kiểm tra lại địa chỉ.";
                        document.getElementById('shippingResult').className = "mt-2 text-end text-danger fw-bold small";
                        document.getElementById('shippingResult').style.display = 'block';
                    } else {
                        currentShippingFee = data.fee;
                        displayShippingFee.setAttribute('data-calculated-fee', currentShippingFee);
                        displayShippingFee.innerText = new Intl.NumberFormat('vi-VN').format(currentShippingFee) + ' đ';
                        
                        document.getElementById('shippingResult').innerText = `Khoảng cách: ${data.distance} km - Phí ship: ${new Intl.NumberFormat('vi-VN').format(currentShippingFee)} đ`;
                        document.getElementById('shippingResult').className = "mt-2 text-end text-success fw-bold small";
                        document.getElementById('shippingResult').style.display = 'block';
                        
                        updateTotal();
                    }
                })
                .catch(err => {
                    btnCalcShipping.innerHTML = 'Tính phí ship';
                    console.error('Error:', err);
                });
            });
            
            // Validate form on submit
            document.getElementById('checkoutForm').addEventListener('submit', function(e) {
                if (deliveryShipping.checked) {
                    if (useDifferentAddress.checked) {
                        if (!fullShippingAddress.value || fullShippingAddress.value === defaultUserAddress) {
                            e.preventDefault();
                            Swal.fire('Lỗi', 'Vui lòng nhập đầy đủ địa chỉ giao hàng mới', 'warning');
                        } else if (currentShippingFee === 0 && document.getElementById('shippingResult').style.display === 'none') {
                             e.preventDefault();
                             Swal.fire('Lưu ý', 'Vui lòng nhấn "Tính phí ship" trước khi Xác nhận mượn truyện', 'info');
                        }
                    } else {
                        fullShippingAddress.value = defaultUserAddress; // ensure it submits default address
                    }
                }
            });
        });
    </script>
</body>
</html>

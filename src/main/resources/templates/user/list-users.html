<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Quản lý người dùng | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .admin-header-waka {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
        .btn-action-waka {
            background: #2c2c2c;
            color: #16a085;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .btn-action-waka:hover {
            background: #16a085;
            color: #fff;
        }
        .form-select-waka {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='users')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0">Quản lý người dùng</h3>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/user/trash}" class="btn btn-outline-warning rounded-pill px-4">
                        <i class="bi bi-trash me-2"></i>Thùng rác
                    </a>
                </div>
            </div>

            <!-- Content Area -->
            <form id="roleChangeForm" method="post">
                <div class="table-responsive">
                    <table class="table table-waka">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Họ và tên</th>
                                <th>Tên đăng nhập</th>
                                <th>Email</th>
                                <th>Quyền hạn</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}" class="text-secondary"></td>
                                <td class="fw-bold text-light" th:text="${user.fullName ?: 'N/A'}"></td>
                                <td th:text="${user.userName}"></td>
                                <td th:text="${user.email ?: 'N/A'}"></td>
                                <td>
                                    <select th:if="${user.role.roleName.name() != 'ROLE_ADMIN'}"
                                            name="roleChanges"
                                            th:attr="data-user-id=${user.id}"
                                            class="form-select form-select-waka role-select">
                                        <option th:value="'ROLE_USER'" th:selected="${user.role.roleName.name() == 'ROLE_USER'}">USER</option>
                                        <option th:value="'ROLE_LIBRARIAN'" th:selected="${user.role.roleName.name() == 'ROLE_LIBRARIAN'}">LIBRARIAN</option>
                                    </select>
                                    <span th:if="${user.role.roleName.name() == 'ROLE_ADMIN'}" class="badge bg-dark border border-secondary text-info">ADMIN</span>
                                </td>
                                <td class="text-end">
                                    <div th:if="${user.role.roleName.name() != 'ROLE_ADMIN'}" class="btn-group">
                                        <form th:action="@{/user/{id}/soft-delete(id=${user.id})}" method="post">
                                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="return confirm('Xóa người dùng này?')">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-4">
                    <button type="button" id="saveRoleChanges" class="btn btn-info rounded-pill px-5 fw-bold">LƯU THAY ĐỔI</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('saveRoleChanges').addEventListener('click', function () {
        const selects = document.querySelectorAll('.role-select');
        let hasChanges = false;
        selects.forEach(select => {
            const userId = select.getAttribute('data-user-id');
            const newRole = select.value;
            // logic để kiểm tra thay đổi thực tế có thể thêm ở đây nếu cần
            hasChanges = true;
            const form = document.createElement('form');
            form.method = 'post';
            form.action = `/user/${userId}/change-role`;
            const input = document.createElement('input');
            input.type = 'hidden'; input.name = 'roleName'; input.value = newRole;
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        });
        if (!hasChanges) alert('Không có thay đổi nào.');
    });
</script>
</body>
</html>

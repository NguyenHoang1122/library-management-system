<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Quản Lý Người Dùng</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='users')}"></div>
        </div>

        <!-- DANH SÁCH NGƯỜI DÙNG -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center"><h3
                        class="mb-0 text-primary"><i class="bi bi-people"></i> Quản Lý Người Dùng </h3>
                    <div sec:authorize="hasRole('ADMIN')"><a th:href="@{/user/trash}" class="btn btn-outline-warning">
                        <i class="bi bi-trash"></i> Thùng rác </a></div>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Bảng danh sách -->
                    <form id="roleChangeForm" method="post">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Họ và tên</th>
                                    <th>Tên đăng nhập</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}" class="fw-bold text-muted"></td>
                                    <td th:text="${user.fullName ?: 'N/A'}"></td>
                                    <td th:text="${user.userName}"></td>
                                    <td th:text="${user.email ?: 'N/A'}"></td>
                                    <td>
                                        <select th:if="${!isTrash && user.role.roleName.name() != 'ROLE_ADMIN'}"
                                                name="roleChanges"
                                                th:attr="data-user-id=${user.id}"
                                                class="form-select form-select-sm role-select">
                                            <option th:value="'ROLE_USER'"
                                                    th:selected="${user.role.roleName.name() == 'ROLE_USER'}">USER
                                            </option>
                                            <option th:value="'ROLE_LIBRARIAN'"
                                                    th:selected="${user.role.roleName.name() == 'ROLE_LIBRARIAN'}">
                                                LIBRARIAN
                                            </option>
                                        </select>
                                        <!-- Nếu là admin, chỉ hiển thị badge -->
                                        <span th:if="${isTrash || user.role.roleName.name() == 'ROLE_ADMIN'}"
                                              class="badge bg-secondary"
                                              th:text="${user.role.roleName.name().replace('ROLE_', '')}"></span>
                                    </td>
                                    <td th:if="${isTrash}"
                                        th:text="${#temporals.format(user.deleteAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <form th:if="${!isTrash}"
                                                  th:action="@{/user/{id}/soft-delete(id=${user.id})}"
                                                  method="post" class="d-inline">
                                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                                        onclick="return confirm('Bạn có chắc muốn chuyển vào thùng rác?')"
                                                        title="Chuyển vào thùng rác">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:if="${!isTrash}" class="d-flex justify-content-end mt-3">
                            <button type="button" id="saveRoleChanges" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i> Lưu lại
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('saveRoleChanges').addEventListener('click', function () {
        const selects = document.querySelectorAll('.role-select');
        let hasChanges = false;

        selects.forEach(select => {
            const userId = select.getAttribute('data-user-id');
            const originalRole = select.querySelector('option[selected]').value;
            const newRole = select.value;

            if (originalRole !== newRole) {
                hasChanges = true;
                // Submit từng form riêng biệt (hoặc có thể dùng AJAX để submit tất cả)
                const form = document.createElement('form');
                form.method = 'post';
                form.action = `/user/${userId}/change-role`;
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'roleName';
                input.value = newRole;
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        });

        if (!hasChanges) {
            alert('Không có thay đổi nào để lưu.');
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Quản lý người dùng | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/list-users.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='users')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0"><i class="bi bi-people me-2 text-warning"></i> Quản lý người dùng</h3>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/user/trash}" class="btn btn-outline-warning rounded-pill px-4">
                        <i class="bi bi-trash me-2"></i>Thùng rác
                    </a>
                </div>
            </div>

            <!-- Search Area -->
            <form th:action="@{/user/search}" method="get" class="mb-4">
                <div class="search-box-waka">
                    <i class="bi bi-search text-secondary me-2"></i>
                    <input type="text" name="query" class="form-control" placeholder="Tìm kiếm theo họ tên, email hoặc tên đăng nhập..." th:value="${searchQuery}">
                    <button type="submit" class="btn btn-link text-info p-0 ms-2 text-decoration-none fw-bold">TÌM</button>
                </div>
            </form>

            <!-- Content Area -->
            <form id="roleChangeForm" method="post">
                <div class="table-responsive">
                    <table class="table table-waka">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Họ và tên</th>
                                <th>Tên đăng nhập</th>
                                <th>Email</th>
                                <th>Quyền hạn</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}" class="text-secondary"></td>
                                <td class="fw-bold text-light" th:text="${user.fullName ?: 'N/A'}"></td>
                                <td th:text="${user.userName}"></td>
                                <td th:text="${user.email ?: 'N/A'}"></td>
                                <td>
                                    <select th:if="${user.role.roleName.name() != 'ROLE_ADMIN'}"
                                            name="roleChanges"
                                            th:attr="data-user-id=${user.id}"
                                            class="form-select form-select-waka role-select">
                                        <option th:value="'ROLE_USER'" th:selected="${user.role.roleName.name() == 'ROLE_USER'}">USER</option>
                                        <option th:value="'ROLE_LIBRARIAN'" th:selected="${user.role.roleName.name() == 'ROLE_LIBRARIAN'}">LIBRARIAN</option>
                                    </select>
                                    <span th:if="${user.role.roleName.name() == 'ROLE_ADMIN'}" class="badge bg-dark border border-secondary text-info">ADMIN</span>
                                </td>
                                <td class="text-end">
                                    <div th:if="${user.role.roleName.name() != 'ROLE_ADMIN'}" class="btn-group">
                                        <form th:action="@{/user/{id}/soft-delete(id=${user.id})}" method="post" class="d-inline delete-user-form">
                                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 btn-delete-user">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center py-5 text-secondary">
                                    <i class="bi bi-people display-4 text-secondary mb-3 d-block"></i>
                                    Không tìm thấy người dùng nào phù hợp.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-4">
                    <button type="button" id="saveRoleChanges" class="btn btn-info rounded-pill px-5 fw-bold">LƯU THAY ĐỔI</button>
                </div>
            </form>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/user/search' : '/user'}(query=${searchQuery}, page=${currentPage - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:text="${i}" th:href="@{${searchQuery != null ? '/user/search' : '/user'}(query=${searchQuery}, page=${i})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/user/search' : '/user'}(query=${searchQuery}, page=${currentPage + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script th:src="@{/js/list-users.js}"></script>
</body>
</html>

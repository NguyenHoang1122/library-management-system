<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thông Tin Cá Nhân</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .avatar-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0d6efd;
            padding: 3px;
        }
        .profile-card {
            border: none;
            border-radius: 15px;
        }
        .info-label {
            font-weight: bold;
            color: #495057;
        }
        .info-value {
            color: #212529;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <div class="col-md-3 col-lg-2 mb-4" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
            <div th:replace="~{admin/dashboard :: admin_sidebar(activePage='profile')}"></div>
        </div>

        <!-- Nội dung chính -->
        <div th:class="${#authorization.expression('hasAnyRole(''ADMIN'',''LIBRARIAN'')')} ? 'col-md-9 col-lg-10' : 'col-md-8 mx-auto'">
            <div class="card shadow profile-card">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0"><i class="bi bi-person-bounding-box me-2"></i> Thông Tin Cá Nhân</h4>
                </div>

                <div class="card-body p-4">
                    <div class="row">
                        <!-- Phần bên trái: Ảnh đại diện -->
                        <div class="col-md-4 text-center border-end">
                            <div class="mb-3">
                                <img th:src="${user.image != null ? user.image : 'https://via.placeholder.com/150'}"
                                     alt="Avatar" class="avatar-preview mb-3 shadow-sm" />
                                <p class="text-muted small">Ảnh đại diện</p>
                            </div>
                        </div>

                        <!-- Phần bên phải: Thông tin chi tiết -->
                        <div class="col-md-8 ps-md-4">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Tên đăng nhập:</div>
                                    <div class="info-value" th:text="${user.userName}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Họ và Tên:</div>
                                    <div class="info-value" th:text="${user.fullName}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Email:</div>
                                    <div class="info-value" th:text="${user.email}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Số điện thoại:</div>
                                    <div class="info-value" th:text="${user.phoneNumber ?: 'Chưa cập nhật'}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="info-label">Địa chỉ:</div>
                                <div class="info-value" th:text="${user.address ?: 'Chưa cập nhật'}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Vai trò:</div>
                                    <div class="info-value" th:text="${user.role != null ? user.role.roleDescription : 'Chưa xác định'}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Trạng thái:</div>
                                    <div class="info-value" th:text="${user.userStatus}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Ngày tạo tài khoản:</div>
                                    <div class="info-value" th:text="${#temporals.format(user.createDate, 'dd/MM/yyyy HH:mm')}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="info-label">Cập nhật lần cuối:</div>
                                    <div class="info-value" th:text="${user.updateDate != null ? #temporals.format(user.updateDate, 'dd/MM/yyyy HH:mm') : 'Chưa cập nhật'}"></div>
                                </div>
                            </div>

                            <!-- Nút hành động -->
                            <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/user/profile/edit}" class="btn btn-primary px-4">
                                    <i class="bi bi-pencil me-2"></i> Chỉnh sửa thông tin
                                </a>
                                <a th:href="@{/}" class="btn btn-outline-secondary px-4">Quay lại</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

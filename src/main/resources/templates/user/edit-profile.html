<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Cập nhật hồ sơ | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        /* Đồng bộ Tabs với trang Active/Wishlist */
        .waka-tabs-main {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .waka-tab-item {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .waka-tab-item:hover, .waka-tab-item.active {
            color: #16a085;
        }
        .waka-tab-item.active {
            position: relative;
        }
        .waka-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #16a085;
        }

        /* Profile Card Styling */
        .profile-card-waka {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        .avatar-preview-waka {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #16a085;
            padding: 4px;
            transition: 0.3s;
            background: #222;
        }
        .form-control-waka {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control-waka:focus {
            background-color: #252525;
            border-color: #16a085;
            color: #fff;
            box-shadow: none;
        }
        .form-control-waka:disabled {
            background-color: #121212;
            border-color: #222;
            color: #666;
        }
        .input-group-text-waka {
            background-color: #252525;
            border: 1px solid #333;
            color: #16a085;
            border-radius: 10px 0 0 10px;
        }
    </style>
</head>
<body>
<!-- Nhúng CSS sidebar tương tự trang Active/Wishlist -->
<style th:replace="~{fragments/sidebar :: sidebar_styles}"></style>

<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar - Đồng bộ cấu trúc col-md-3 -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='profile')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Tabs Menu đồng bộ -->
            <div class="waka-tabs-main">
                <a href="#" class="waka-tab-item active">Hồ sơ cá nhân</a>
                <a th:href="@{/borrow/active}" class="waka-tab-item">Truyện của tôi</a>
            </div>

            <!-- Profile Content Area -->
            <div class="profile-card-waka shadow-lg">
                <div class="p-4 border-bottom border-secondary">
                    <h5 class="mb-0 text-light"><i class="bi bi-person-gear me-2 text-info"></i>Cập nhật thông tin cá nhân</h5>
                </div>

                <div class="p-4 p-md-5">
                    <form th:action="@{/user/profile/update}" th:object="${userDTO}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{userName}"/>

                        <div class="row">
                            <!-- Left: Avatar Section -->
                            <div class="col-md-4 text-center border-end border-secondary pe-md-5 mb-4 mb-md-0">
                                <div class="mb-4">
                                    <img id="previewImage" th:src="${user.image != null ? user.image : '/images/default-avatar.png'}" alt="Avatar" class="avatar-preview-waka mb-4 shadow">
                                    <div class="px-2">
                                        <input type="file" name="imageFile" id="imageFile" class="form-control form-control-sm form-control-waka mb-2" accept="image/*" style="font-size: 0.75rem;">
                                        <p class="text-secondary small mt-2"><i class="bi bi-info-circle me-1"></i>Định dạng: JPG, PNG. Tối đa 10MB.</p>
                                        <p id="fileName" class="text-info small fw-bold"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Form Info Section -->
                            <div class="col-md-8 ps-md-5">
                                <div class="mb-4">
                                    <label class="form-label small text-secondary fw-bold">TÊN ĐĂNG NHẬP</label>
                                    <input type="text" class="form-control form-control-waka" th:value="*{userName}" disabled>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label small text-secondary fw-bold">HỌ VÀ TÊN</label>
                                    <div class="input-group">
                                        <span class="input-group-text input-group-text-waka"><i class="bi bi-person"></i></span>
                                        <input type="text" th:field="*{fullName}" class="form-control form-control-waka" style="border-radius: 0 10px 10px 0;" required placeholder="Nhập họ và tên...">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label small text-secondary fw-bold">EMAIL</label>
                                        <div class="input-group">
                                            <span class="input-group-text input-group-text-waka"><i class="bi bi-envelope"></i></span>
                                            <input type="email" th:field="*{email}" class="form-control form-control-waka" style="border-radius: 0 10px 10px 0;" required placeholder="example@mail.com">
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label small text-secondary fw-bold">SỐ ĐIỆN THOẠI</label>
                                        <div class="input-group">
                                            <span class="input-group-text input-group-text-waka"><i class="bi bi-telephone"></i></span>
                                            <input type="text" th:field="*{phoneNumber}" class="form-control form-control-waka" style="border-radius: 0 10px 10px 0;" placeholder="0xxx xxx xxx">
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label small text-secondary fw-bold">ĐỊA CHỈ</label>
                                    <div class="input-group">
                                        <span class="input-group-text input-group-text-waka"><i class="bi bi-geo-alt"></i></span>
                                        <input type="text" th:field="*{address}" class="form-control form-control-waka" style="border-radius: 0 10px 10px 0;" placeholder="Nhập địa chỉ của bạn...">
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="mt-5 d-flex gap-3 justify-content-end">
                                    <a th:href="@{/user/profile}" class="btn btn-outline-secondary rounded-pill px-4" style="font-size: 0.9rem;">Hủy bỏ</a>
                                    <button type="submit" class="btn btn-info rounded-pill px-5 fw-bold" style="font-size: 0.9rem;">
                                        <i class="bi bi-check2-circle me-1"></i> LƯU THAY ĐỔI
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Preview hình ảnh khi chọn file
    document.getElementById('imageFile').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            // Kiểm tra dung lượng (10MB)
            if (file.size > 10 * 1024 * 1024) {
                alert("Dung lượng file quá lớn! Vui lòng chọn file dưới 10MB.");
                this.value = "";
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('fileName').textContent = '✓ ' + file.name;
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>

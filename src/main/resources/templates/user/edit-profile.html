<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Cập nhật Profile</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .avatar-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0d6efd;
            padding: 3px;
        }
        .profile-card {
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <div class="col-md-3 col-lg-2 mb-4" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
            <div th:replace="~{admin/dashboard :: admin_sidebar(activePage='profile')}"></div>
        </div>

        <!-- CỘT 2: NỘI DUNG PROFILE -->
        <div th:class="${#authorization.expression('hasAnyRole(''ADMIN'',''LIBRARIAN'')')} ? 'col-md-9 col-lg-10' : 'col-md-8 mx-auto'">

            <div class="card shadow profile-card">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0"><i class="bi bi-person-bounding-box me-2"></i> Cập nhật Thông Tin Cá Nhân</h4>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <i class="bi bi-exclamation-octagon me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/user/profile/update}" th:object="${userDTO}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{userName}" />

                        <div class="row">
                            <!-- Phần bên trái: Ảnh đại diện -->
                            <div class="col-md-4 text-center border-end">
                                <div class="mb-3">
                                    <label class="d-block fw-bold mb-2">Ảnh đại diện</label>
                                    <img th:src="${user.image != null ? user.image : '/images/default-avatar.png'}"
                                         alt="Avatar" class="avatar-preview mb-3 shadow-sm" />
                                    <div class="px-3">
                                        <input type="file" name="imageFile" id="imageFile" class="form-control form-control-sm" accept="image/*" />
                                        <small class="text-muted d-block mt-2">Chọn file ảnh mới để thay đổi</small>
                                    </div>
                                </div>
                            </div>

                            <!-- Phần bên phải: Thông tin chi tiết -->
                            <div class="col-md-8 ps-md-4">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên đăng nhập:</label>
                                    <input type="text" class="form-control bg-light" th:value="*{userName}" disabled>
                                    <small class="text-muted">Tên đăng nhập không thể thay đổi.</small>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Họ và Tên:</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" th:field="*{fullName}" class="form-control" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Email:</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" th:field="*{email}" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Số điện thoại:</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input type="text" th:field="*{phoneNumber}" class="form-control">
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a th:href="@{/user/profile}" class="btn btn-outline-secondary px-4">Quay lại</a>
                                    <button type="submit" class="btn btn-primary px-5">
                                        <i class="bi bi-save me-2"></i> Lưu thay đổi
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

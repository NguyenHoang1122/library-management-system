<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thùng Rác Người Dùng</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='trash')}"></div>
        </div>

        <!-- THÙNG RÁC NGƯỜI DÙNG -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-trash"></i>
                        Thùng Rác Người Dùng
                    </h3>
                    <div sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/user}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left"></i> Quay lại danh sách
                        </a>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Bảng danh sách thùng rác -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Họ và tên</th>
                                <th>Tên đăng nhập</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Ngày xóa</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}" class="fw-bold text-muted"></td>
                                <td th:text="${user.fullName ?: 'N/A'}"></td>
                                <td th:text="${user.userName}"></td>
                                <td th:text="${user.email ?: 'N/A'}"></td>
                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${user.role.roleName.name().replace('ROLE_', '')}"></span>
                                </td>
                                <td th:text="${#temporals.format(user.deleteAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <!-- Nút Khôi phục -->
                                        <form th:action="@{/user/{id}/restore(id=${user.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-success btn-sm"
                                                    title="Khôi phục">
                                                <i class="bi bi-arrow-counterclockwise"></i>
                                            </button>
                                        </form>

                                        <!-- Nút Xóa vĩnh viễn -->
                                        <form th:action="@{/user/{id}/permanently-delete(id=${user.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                                    onclick="return confirm('Bạn có chắc muốn xóa vĩnh viễn?')"
                                                    title="Xóa vĩnh viễn">
                                                <i class="bi bi-x-circle"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    Thùng rác trống
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

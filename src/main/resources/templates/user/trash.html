<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thùng Rác Người Dùng | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/trash.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='trash')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0"><i class="bi bi-trash me-2 text-warning"></i> Thùng rác người dùng</h3>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/user}" class="btn btn-outline-info rounded-pill px-4 fw-bold">
                        <i class="bi bi-arrow-left me-2"></i>QUAY LẠI
                    </a>
                </div>
            </div>

            <!-- Search Area -->
            <form th:action="@{/user/trash/search}" method="get" class="mb-4">
                <div class="search-box-waka">
                    <i class="bi bi-search text-secondary me-2"></i>
                    <input type="text" name="query" class="form-control" placeholder="Tìm kiếm tài khoản bị xóa..." th:value="${searchQuery}">
                    <button type="submit" class="btn btn-link text-info p-0 ms-2 text-decoration-none fw-bold">TÌM</button>
                </div>
            </form>

            <!-- Bảng danh sách thùng rác -->
            <div class="table-responsive">
                <table class="table table-waka align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Họ và tên</th>
                            <th>Tên đăng nhập</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Ngày xóa</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}" class="text-secondary"></td>
                            <td class="fw-bold text-light" th:text="${user.fullName ?: 'N/A'}"></td>
                            <td th:text="${user.userName}"></td>
                            <td th:text="${user.email ?: 'N/A'}"></td>
                            <td>
                                <span class="badge bg-dark border border-secondary text-info px-2 py-1"
                                      th:text="${user.role.roleName.name().replace('ROLE_', '')}"></span>
                            </td>
                            <td class="text-secondary" th:text="${#temporals.format(user.deleteAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <div class="btn-group gap-2 justify-content-end" role="group">
                                    <!-- Nút Khôi phục -->
                                    <form th:action="@{/user/{id}/restore(id=${user.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-success btn-sm rounded-pill px-3 fw-bold" title="Khôi phục">
                                            <i class="bi bi-arrow-counterclockwise me-1"></i> KHÔI PHỤC
                                        </button>
                                    </form>

                                    <!-- Nút Xóa vĩnh viễn -->
                                    <form th:action="@{/user/{id}/permanently-delete(id=${user.id})}" method="post" class="d-inline permanently-delete-form">
                                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold btn-delete-permanent"
                                                title="Xóa vĩnh viễn">
                                            <i class="bi bi-trash-fill me-1"></i> XÓA VĨNH VIỄN
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center py-5 text-secondary">
                                <i class="bi bi-trash2 display-4 text-secondary mb-3 d-block"></i>
                                Thùng rác trống. Không có tài khoản bị xóa tạm thời nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/user/trash/search' : '/user/trash'}(query=${searchQuery}, page=${currentPage - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:text="${i}" th:href="@{${searchQuery != null ? '/user/trash/search' : '/user/trash'}(query=${searchQuery}, page=${i})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/user/trash/search' : '/user/trash'}(query=${searchQuery}, page=${currentPage + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/trash.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .result-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .icon-success {
            color: #198754;
            font-size: 64px;
            margin-bottom: 20px;
        }
        .icon-error {
            color: #dc3545;
            font-size: 64px;
            margin-bottom: 20px;
        }
        .btn-return {
            margin-top: 30px;
            border-radius: 20px;
            padding: 10px 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="result-card">
        <div th:if="${isSuccess}">
            <i class="bi bi-check-circle-fill icon-success"></i>
            <h3>Thanh toán thành công</h3>
        </div>
        <div th:if="${!isSuccess}">
            <i class="bi bi-x-circle-fill icon-error"></i>
            <h3>Thanh toán thất bại</h3>
        </div>
        
        <p class="mt-4 mb-4 text-secondary" th:text="${message}"></p>
        
        <a href="/user/profile" class="btn btn-outline-light btn-return">
            <i class="bi bi-arrow-left me-2"></i>Quay lại tài khoản
        </a>
    </div>
</body>
</html>

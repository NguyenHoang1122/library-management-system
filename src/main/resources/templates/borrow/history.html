<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lịch sử mượn truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/borrow-history.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='myborrows')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Main Tabs -->
            <div class="waka-tabs-main">
                <a th:href="@{/borrow/active}" class="waka-tab-item">Đang mượn</a>
                <a th:href="@{/wishlist}" class="waka-tab-item">Yêu thích</a>
                <a href="#" class="waka-tab-item active">Lịch sử</a>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-5">
                <div class="col-md-4 mb-3">
                    <div class="stat-card-waka">
                        <div class="small text-secondary mb-1">Đang mượn</div>
                        <h2 class="mb-0" th:text="${totalActive}">0</h2>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="stat-card-waka">
                        <div class="small text-secondary mb-1">Tổng lịch sử mượn</div>
                        <h2 class="mb-0" th:text="${totalBorrows}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div th:if="${borrowHistory.isEmpty()}" class="text-center py-5">
                <i class="bi bi-clock-history" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa có lịch sử mượn truyện nào.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Khám phá truyện</a>
            </div>

            <div th:if="${!borrowHistory.isEmpty()}" class="table-responsive">
                <table class="table table-waka">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên truyện</th>
                            <th>Ngày mượn</th>
                            <th>Ngày phải trả</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="borrow, borrowStat : ${borrowHistory}">
                            <td th:text="${(currentPage - 1) * 10 + borrowStat.count}">1</td>
                            <td class="fw-bold">
                                <a th:href="@{/books/{id}(id=${borrow.bookId})}" class="text-info text-decoration-none" th:text="${borrow.bookName}">Tên truyện</a>
                            </td>
                            <td th:text="${borrow.borrowDate}">Ngày mượn</td>
                            <td th:text="${borrow.dueDate}">Ngày phải trả</td>
                            <td class="text-end">
                                <a th:href="@{/books/{id}(id=${borrow.bookId})}" class="btn btn-outline-info btn-sm rounded-pill px-3">Chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/borrow/history(page=${currentPage - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:text="${i}" th:href="@{/borrow/history(page=${i})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/borrow/history(page=${currentPage + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

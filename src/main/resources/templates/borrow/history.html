<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lịch sử mượn truyện</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.65rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-borrowed {
            background-color: #0dcaf0;
            color: white;
        }
        .status-returned {
            background-color: #198754;
            color: white;
        }
        .status-overdue {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='myborrows')}"></div>
        </div>

        <!-- HISTORY CONTENT -->
        <div class="col-md-9 col-lg-10">
            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Đang mượn</h5>
                            <h2 th:text="${totalActive}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Tổng lịch sử mượn truyện</h5>
                            <h2 th:text="${totalBorrows}"></h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Borrow History -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-primary">
                        <i class="bi bi-clock-history"></i> Lịch sử mượn
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${borrowHistory.isEmpty()}" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                        <p class="mt-2">Bạn chưa có lịch sử mượn truyện</p>
                    </div>
                    <div th:if="${!borrowHistory.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>STT</th>
                                    <th>Tên truyện</th>
                                    <th>Ngày mượn</th>
                                    <th>Ngày phải trả</th>
                                    <th>Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="borrow, borrowStat : ${borrowHistory}">
                                    <td th:text="${borrowStat.index + 1}"></td>
                                    <td th:text="${borrow.bookName}"></td>
                                    <td th:text="${borrow.borrowDate}"></td>
                                    <td th:text="${borrow.dueDate}"></td>
                                    <td>
                                        <a th:href="@{/borrow/{id}(id=${borrow.id})}" class="btn btn-outline-info btn-sm">
                                            <i class="bi bi-eye"></i> Xem
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lịch sử mượn sách</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.65rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-borrowed {
            background-color: #0dcaf0;
            color: white;
        }
        .status-returned {
            background-color: #198754;
            color: white;
        }
        .status-overdue {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='myborrows')}"></div>
        </div>

        <!-- HISTORY CONTENT -->
        <div class="col-md-9 col-lg-10">
            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Đang mượn</h5>
                            <h2 th:text="${totalActive}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Tổng lộc sử</h5>
                            <h2 th:text="${totalBorrows}"></h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active Borrows -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-primary">
                        <i class="bi bi-bookmark-fill"></i> Sách đang mượn
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${activeBorrows.isEmpty()}" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                        <p class="mt-2">Hiện tại bạn chưa mượn sách nào</p>
                    </div>
                    <div th:if="${!activeBorrows.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Ngày mượn</th>
                                    <th>Ngày trả dự định</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="borrow : ${activeBorrows}">
                                    <td th:text="${borrow.id}" class="fw-bold"></td>
                                    <td th:text="${#temporals.format(borrow.borrowDate, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span th:text="${#temporals.format(borrow.dueDate, 'dd/MM/yyyy')}"></span>
                                        <span th:if="${#dates.createNow() > borrow.dueDate}" class="badge bg-danger ms-2">QUÁSẠN</span>
                                    </td>
                                    <td>
                                        <span th:if="${borrow.status == T(com.librarymanagementsystem.model.borrow.status.TransactionStatus).BORROWED}"
                                              class="status-badge status-borrowed">Đang mượn</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/borrow/{id}(id=${borrow.id})}" class="btn btn-outline-info btn-sm">
                                            <i class="bi bi-eye"></i> Xem chi tiết
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Borrow History -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-primary">
                        <i class="bi bi-clock-history"></i> Lịch sử mượn
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${borrowHistory.isEmpty()}" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                        <p class="mt-2">Bạn chưa có lịch sử mượn sách</p>
                    </div>
                    <div th:if="${!borrowHistory.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Ngày mượn</th>
                                    <th>Ngày trả dự định</th>
                                    <th>Ngày trả thực tế</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="borrow : ${borrowHistory}">
                                    <td th:text="${borrow.id}" class="fw-bold text-muted"></td>
                                    <td th:text="${#temporals.format(borrow.borrowDate, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#temporals.format(borrow.dueDate, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${borrow.returnDate != null ? #temporals.format(borrow.returnDate, 'dd/MM/yyyy') : 'Chưa trả'}"></td>
                                    <td>
                                        <span th:if="${borrow.status == T(com.librarymanagementsystem.model.borrow.status.TransactionStatus).RETURNED}"
                                              class="status-badge status-returned">Đã trả</span>
                                        <span th:if="${borrow.status == T(com.librarymanagementsystem.model.borrow.status.TransactionStatus).OVERDUE}"
                                              class="status-badge status-overdue">Quá hạn</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/borrow/{id}(id=${borrow.id})}" class="btn btn-outline-info btn-sm">
                                            <i class="bi bi-eye"></i> Xem
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

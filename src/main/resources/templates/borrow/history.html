<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lịch sử mượn truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .waka-tabs-main {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .waka-tab-item {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .waka-tab-item:hover, .waka-tab-item.active {
            color: #16a085;
        }
        .waka-tab-item.active {
            position: relative;
        }
        .waka-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #16a085;
        }
        .stat-card-waka {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s;
        }
        .stat-card-waka:hover {
            transform: translateY(-5px);
            border-color: #16a085;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='myborrows')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Main Tabs -->
            <div class="waka-tabs-main">
                <a th:href="@{/borrow/active}" class="waka-tab-item">Đang mượn</a>
                <a th:href="@{/wishlist}" class="waka-tab-item">Yêu thích</a>
                <a href="#" class="waka-tab-item active">Lịch sử</a>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-5">
                <div class="col-md-4 mb-3">
                    <div class="stat-card-waka">
                        <div class="small text-secondary mb-1">Đang mượn</div>
                        <h2 class="mb-0" th:text="${totalActive}">0</h2>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="stat-card-waka">
                        <div class="small text-secondary mb-1">Tổng lịch sử mượn</div>
                        <h2 class="mb-0" th:text="${totalBorrows}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div th:if="${borrowHistory.isEmpty()}" class="text-center py-5">
                <i class="bi bi-clock-history" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa có lịch sử mượn truyện nào.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Khám phá truyện</a>
            </div>

            <div th:if="${!borrowHistory.isEmpty()}" class="table-responsive">
                <table class="table table-waka">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên truyện</th>
                            <th>Ngày mượn</th>
                            <th>Ngày phải trả</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="borrow, borrowStat : ${borrowHistory}">
                            <td th:text="${borrowStat.index + 1}">1</td>
                            <td class="fw-bold" th:text="${borrow.bookName}">Tên truyện</td>
                            <td th:text="${borrow.borrowDate}">Ngày mượn</td>
                            <td th:text="${borrow.dueDate}">Ngày phải trả</td>
                            <td class="text-end">
                                <a th:href="@{/borrow/${borrow.id}}" class="btn btn-outline-light btn-sm rounded-pill px-3">Chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

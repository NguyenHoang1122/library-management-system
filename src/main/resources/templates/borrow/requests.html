<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách yêu cầu mượn | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/borrow-requests.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='borrow')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0">Yêu cầu mượn truyện</h3>
            </div>

            <!-- Content Area -->
            <div th:if="${borrowRequests == null or borrowRequests.isEmpty()}" class="text-center py-5">
                <i class="bi bi-list-check" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa có yêu cầu mượn truyện nào.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Tìm truyện mượn</a>
            </div>

            <div th:if="${borrowRequests != null and !borrowRequests.isEmpty()}" class="table-responsive">
                <table class="table table-waka">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Sách</th>
                            <th>Ngày yêu cầu</th>
                            <th>Trạng thái</th>
                            <th>Ghi chú</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request, iterStat : ${borrowRequests}">
                            <td th:text="${iterStat.count}" class="text-secondary"></td>
                            <td class="fw-bold text-light" th:text="${request.borrowRequestItems[0].book.title}"></td>
                            <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2" 
                                      th:classappend="${request.requestStatus.name() == 'PENDING' ? 'badge-pending' : (request.requestStatus.name() == 'APPROVED' ? 'badge-approved' : 'badge-rejected')}"
                                      th:text="${request.requestStatus.name() == 'PENDING' ? 'Chờ duyệt' : (request.requestStatus.name() == 'APPROVED' ? 'Đã duyệt' : 'Từ chối')}">Trạng thái</span>
                            </td>
                            <td>
                                <div th:if="${request.note != null and !request.note.isEmpty()}">
                                    <span class="text-secondary small">Bạn:</span> <span th:text="${request.note}"></span>
                                </div>
                                <div th:if="${request.requestStatus.name() == 'REJECTED' and request.rejectionReason != null and !request.rejectionReason.isEmpty()}">
                                    <span class="text-danger small">Lý do từ chối:</span> <span class="text-danger fw-bold" th:text="${request.rejectionReason}"></span>
                                </div>
                                <div th:if="${(request.note == null or request.note.isEmpty()) and (request.rejectionReason == null or request.rejectionReason.isEmpty())}">
                                    <span class="text-secondary">-</span>
                                </div>
                            </td>
                             <td class="text-end">
                                <form th:if="${request.requestStatus.name() == 'PENDING'}"
                                      th:action="@{/borrow/{requestId}/cancel(requestId=${request.id})}"
                                      method="post"
                                      class="d-inline">
                                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3 btn-cancel-request">Hủy</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/borrow-requests.js}"></script>
</body>
</html>

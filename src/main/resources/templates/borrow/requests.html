<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách yêu cầu mượn truyện</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='borrow')}"></div>
        </div>

        <!-- CONTENT -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-list-check"></i> Danh sách yêu cầu mượn truyện
                    </h3>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Danh sách yêu cầu -->
                    <div th:if="${borrowRequests != null and !borrowRequests.isEmpty()}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Sách</th>
                                <th>Ngày yêu cầu</th>
                                <th>Trạng thái</th>
                                <th>Ghi chú</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="request : ${borrowRequests}">
                                <td th:text="${request.id}"></td>
                                <td th:text="${request.borrowRequestItems[0].book.title}"></td>
                                <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                     <span th:class="'badge ' + (${request.requestStatus.name() == 'PENDING'} ? 'bg-warning' : (${request.requestStatus.name() == 'APPROVED'} ? 'bg-success' : 'bg-danger'))"
                                        th:text="${request.requestStatus}"></span>
                                </td>
                                <td th:text="${request.note != null ? request.note : 'Không có'}"></td>
                                <td>
                                    <form th:if="${request.requestStatus.name() == 'PENDING'}"
                                          th:action="@{/borrow/{requestId}/cancel(requestId=${request.id})}"
                                          method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Bạn có chắc muốn hủy yêu cầu này?')">
                                            <i class="bi bi-x-circle"></i> Hủy
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Nếu không có yêu cầu -->
                    <div th:if="${borrowRequests == null or borrowRequests.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-info-circle text-muted" style="font-size: 3rem;"></i>
                        <h5 class="text-muted mt-3">Bạn chưa có yêu cầu mượn truyện nào.</h5>
                        <a th:href="@{/books}" class="btn btn-primary mt-3">
                            <i class="bi bi-search"></i> Tìm truyện để mượn
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

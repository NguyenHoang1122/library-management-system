<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Truyện đang mượn</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .status-badge { /* Giữ nguyên style từ history.html nếu cần */ }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container-fluid my-5 px-4">
    <div class="row">
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='activeborrows')}"></div>
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-primary"><i class="bi bi-bookmark-fill"></i> Truyện đang mượn</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${activeBorrows.isEmpty()}" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox"></i>
                        <p class="mt-2">Hiện tại bạn chưa mượn truyện nào</p>
                    </div>
                    <div th:if="${!activeBorrows.isEmpty()}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>STT</th>
                                <th>Tên truyện</th>
                                <th>Ngày mượn</th>
                                <th>Ngày phải trả</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="borrow, borrowStat : ${activeBorrows}">
                                <td th:text="${borrowStat.index + 1}"></td>
                                <td th:text="${borrow.bookName}"></td>
                                <td th:text="${borrow.borrowDate}"></td>
                                <td th:text="${borrow.dueDate}"></td>
                                <td>
                                    <form th:action="@{/borrow/{id}/return(id=${borrow.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-warning btn-sm">
                                            <i class="bi bi-arrow-return-left"></i> Trả truyện
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

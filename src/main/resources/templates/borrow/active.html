<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Truyện đang mượn | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .waka-tabs-main {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .waka-tab-item {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .waka-tab-item:hover, .waka-tab-item.active {
            color: #16a085;
        }
        .waka-tab-item.active {
            position: relative;
        }
        .waka-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #16a085;
        }
        .filter-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .btn-filter {
            background: #2c2c2c;
            color: #ccc;
            border: none;
            padding: 6px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .btn-filter.active {
            background: #fff;
            color: #000;
            font-weight: bold;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }
        .waka-card {
            background: transparent;
            border: none;
            transition: transform 0.3s;
        }
        .waka-card:hover {
            transform: translateY(-8px);
        }
        .waka-img-container {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 2/3;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }
        .waka-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-hv {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f39c12;
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .due-date-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: #f1c40f;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .waka-card-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #eee;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.7rem;
            margin-bottom: 8px;
        }
        .waka-card-actions {
            display: flex;
            gap: 5px;
        }
        .btn-action-sm {
            flex: 1;
            padding: 4px;
            font-size: 0.75rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<!-- Nhúng CSS sidebar -->
<style th:replace="~{fragments/sidebar :: sidebar_styles}"></style>

<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='activeborrows')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Main Tabs -->
            <div class="waka-tabs-main">
                <a href="#" class="waka-tab-item active">Đang mượn</a>
            </div>

            <!-- Content Area -->
            <div th:if="${activeBorrows.isEmpty()}" class="text-center py-5">
                <i class="bi bi-journal-x" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa mượn truyện nào trong danh sách này.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Khám phá ngay</a>
            </div>

            <div th:if="${!activeBorrows.isEmpty()}" class="book-grid">
                <div th:each="borrow : ${activeBorrows}" class="waka-card">
                    <div class="waka-img-container">
                        <!-- Giả định DTO có image, nếu không dùng placeholder -->
                        <img th:src="${borrow.bookImage != null ? borrow.bookImage : 'https://via.placeholder.com/200x300?text=No+Image'}"
                             class="waka-img" th:alt="${borrow.bookName}">
                        <div class="due-date-badge">
                            <i class="bi bi-clock"></i> Hạn: <span th:text="${borrow.dueDate}"></span>
                        </div>
                    </div>
                    <div class="waka-card-title" th:text="${borrow.bookName}"></div>
                    <div class="waka-card-actions">
                        <a th:href="@{/books/{id}(id=${borrow.bookId})}" class="btn btn-outline-light btn-action-sm">Chi tiết</a>
                        
                        <!-- Kiểm tra trạng thái -->
                        <th:block th:if="${borrow.status == 'PENDING'}">
                            <!-- Nếu yêu cầu đang chờ duyệt -->
                            <button th:if="${borrow.returnRequestStatus == 'PENDING'}" 
                                    class="btn btn-secondary btn-action-sm w-100 disabled" style="flex: 2;">
                                <i class="bi bi-hourglass-split"></i> Chờ duyệt trả
                            </button>
                            <!-- Nếu yêu cầu đã được duyệt -->
                            <button th:if="${borrow.returnRequestStatus == 'APPROVED'}" 
                                    class="btn btn-info btn-action-sm w-100 disabled" style="flex: 2;">
                                <i class="bi bi-check-circle"></i> Đã duyệt trả
                            </button>
                        </th:block>
                        <th:block th:if="${borrow.status != 'PENDING'}">
                            <button type="button" class="btn btn-warning btn-action-sm w-100" 
                                    style="flex: 2;"
                                    data-bs-toggle="modal" 
                                    data-bs-target="#returnModal"
                                    th:data-id="${borrow.id}"
                                    th:data-name="${borrow.bookName}"
                                    onclick="prepareReturnModal(this)">
                                <i class="bi bi-arrow-return-left"></i> Trả truyện
                            </button>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Return Request Modal -->
<div class="modal fade" id="returnModal" tabindex="-1" aria-labelledby="returnModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="returnModalLabel">Yêu cầu trả truyện</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="returnForm" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-body">
                    <p>Bạn đang yêu cầu trả truyện: <strong id="modalBookName" class="text-info"></strong></p>
                    
                    <div class="mb-3">
                        <label for="returnDateTime" class="form-label text-secondary small fw-bold">THỜI GIAN TRẢ DỰ KIẾN</label>
                        <input type="datetime-local" class="form-control bg-black border-secondary text-light" 
                               id="returnDateTime" name="returnDateTime" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="note" class="form-label text-secondary small fw-bold">GHI CHÚ (TÙY CHỌN)</label>
                        <textarea class="form-control bg-black border-secondary text-light" 
                                  id="note" name="note" rows="3" placeholder="Nhập ghi chú cho thủ thư..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-info rounded-pill px-5 fw-bold">GỬI YÊU CẦU</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function prepareReturnModal(button) {
        const transactionId = button.getAttribute('data-id');
        const bookName = button.getAttribute('data-name');
        
        document.getElementById('modalBookName').innerText = bookName;
        document.getElementById('returnForm').action = '/borrow/' + transactionId + '/return';
        
        // Đặt thời gian mặc định là hiện tại
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('returnDateTime').value = now.toISOString().slice(0, 16);
    }
</script>
</body>
</html>

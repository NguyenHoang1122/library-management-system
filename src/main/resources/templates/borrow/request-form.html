<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gửi yêu cầu mượn truyện</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='myborrows')}"></div>
        </div>

        <!-- FORM CONTENT -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-file-earmark-plus"></i> Gửi yêu cầu mượn truyện
                    </h3>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/borrow/request/{bookId}(bookId=${bookId})}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="bi bi-book"></i> Truyện
                            </label>
                            <input type="text" class="form-control bg-light"
                                   th:value="'Truyện : ' + ${book.title}" disabled>
                            <small class="text-muted">Truyện được chọn sẽ được thêm vào yêu cầu mượn</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="bi bi-vector-pen"></i> Ghi chú (tùy chọn)
                            </label>
                            <textarea name="note" class="form-control" rows="4"
                                      placeholder="Nhập ghi chú thêm (lý do mượn, thời gian cần, v.v.)..."></textarea>
                            <small class="text-muted">Tối đa 500 ký tự</small>
                        </div>

                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Thông tin:</strong>
                            <ul class="mb-0 mt-2">
                                <li>Thời gian mượn mặc định: 14 ngày</li>
                                <li>Thủ thư sẽ duyệt yêu cầu của bạn trong 24 giờ</li>
                                <li>Bạn sẽ nhận được thông báo khi yêu cầu được duyệt</li>
                            </ul>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/books}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-lg"></i> Hủy
                            </a>
                            <button type="submit" class="btn btn-primary px-5">
                                <i class="bi bi-check-lg me-2"></i> Gửi yêu cầu
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

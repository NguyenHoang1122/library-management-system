<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Yêu cầu mượn truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .admin-header-waka {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
        .form-control-waka {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 20px;
            padding-left: 15px;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='borrows')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0">Duyệt yêu cầu mượn truyện</h3>
            </div>

            <!-- Table Area -->
            <div class="table-responsive">
                <table class="table table-waka align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Người dùng</th>
                            <th>Truyện</th>
                            <th>Ghi chú</th>
                            <th>Ngày yêu cầu</th>
                            <th class="text-end">Thao tác duyệt</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${pendingRequests}">
                            <td th:text="${request.id}" class="text-secondary"></td>
                            <td class="fw-bold text-light" th:text="${request.user.fullName}"></td>
                            <td>
                                <div class="text-truncate" style="max-width: 200px;" th:text="${request.borrowRequestItems[0].book.title}"></div>
                            </td>
                            <td th:text="${request.note != null ? request.note : '-'}" class="small"></td>
                            <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy')}"></td>
                            <td class="text-end">
                                <form th:action="@{/librarian/borrows/{id}/approve(id=${request.id})}" method="post" class="d-inline-flex gap-2">
                                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <div class="input-group input-group-sm" style="width: 150px;">
                                        <span class="input-group-text bg-dark border-secondary text-secondary">Ngày</span>
                                        <input type="number" name="borrowDays" value="14" min="1" class="form-control form-control-waka">
                                    </div>
                                    <button type="submit" class="btn btn-success btn-sm rounded-pill px-3">Duyệt</button>
                                </form>
                                <form th:action="@{/librarian/borrows/{id}/reject(id=${request.id})}" method="post" class="d-inline">
                                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="return confirm('Từ chối yêu cầu này?')">Từ chối</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pendingRequests)}">
                            <td colspan="5" class="text-center py-5 text-secondary">Hiện không có yêu cầu nào đang chờ duyệt.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Yêu cầu mượn truyện</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='borrows')}"></div>
        </div>

        <!-- CONTENT -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-list-check"></i> Yêu cầu mượn truyện
                    </h3>
                </div>
                <div class="card-body p-4">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Người dùng</th>
                            <th>Truyện</th>
                            <th>Ngày yêu cầu</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="request : ${pendingRequests}">
                            <td th:text="${request.id}"></td>
                            <td th:text="${request.user.fullName}"></td>
                            <td th:text="${request.borrowRequestItems[0].book.title}"></td>
                            <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy')}"></td>
                            <td>
                                <form th:action="@{/librarian/borrows/{id}/approve(id=${request.id})}" method="post" style="display:inline;">
                                    <input type="number" name="borrowDays" value="14" min="1" class="form-control d-inline w-auto">
                                    <button type="submit" class="btn btn-success btn-sm">Duyệt</button>
                                </form>
                                <form th:action="@{/librarian/borrows/{id}/reject(id=${request.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Từ chối</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

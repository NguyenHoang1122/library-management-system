<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo đơn mượn trực tiếp | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/direct-borrow.css}" rel="stylesheet" />
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row gx-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='direct-borrow')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-4">
            <h3 class="mb-4 text-light fw-bold">
                <i class="bi bi-cart-plus me-2 text-primary"></i>TẠO ĐƠN MƯỢN TRỰC TIẾP TẠI QUẦY
            </h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form id="directBorrowForm" th:action="@{/librarian/direct-borrow}" method="post">
                <div class="row">
                    <div class="col-md-12 mb-4">
                        <div class="card bg-dark-card rounded-3 shadow-sm">
                            <div class="card-header border-bottom border-secondary py-3">
                                <h5 class="mb-0 text-info"><i class="bi bi-person-fill me-2"></i>1. Chọn Độc Giả</h5>
                            </div>
                            <div class="card-body">
                                <select class="form-select select2-user" name="userId" id="userId" required>
                                    <option value="" disabled selected>-- Tìm kiếm độc giả (Email, SĐT, Tên) --</option>
                                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName + ' - ' + u.email + ' - Ví: ' + #numbers.formatDecimal(u.balance != null ? u.balance : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 mb-4">
                        <div class="card bg-dark-card rounded-3 shadow-sm">
                            <div class="card-header border-bottom border-secondary py-3 d-flex justify-content-between align-items-center">
                                <h5 class="mb-0 text-success"><i class="bi bi-book-fill me-2"></i>2. Thêm Truyện Vào Đơn</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-8">
                                        <select class="form-select select2-book" id="bookSelect">
                                            <option value="" disabled selected>-- Tìm kiếm sách (Tiêu đề, ISBN) --</option>
                                            <option th:each="b : ${books}" 
                                                    th:if="${b.quantity > 0}"
                                                    th:value="${b.id}" 
                                                    th:data-title="${b.title}"
                                                    th:data-qty="${b.quantity}"
                                                    th:data-deposit="${b.depositPrice != null ? b.depositPrice : 0}"
                                                    th:text="${b.title + ' (Còn ' + b.quantity + ' cuốn) - Cọc: ' + #numbers.formatDecimal(b.depositPrice != null ? b.depositPrice : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" class="form-control bg-dark text-light border-secondary" id="bookQty" value="1" min="1" placeholder="SL">
                                    </div>
                                    <div class="col-md-2">
                                        <button type="button" class="btn btn-outline-success w-100" id="btnAddBook">
                                            <i class="bi bi-plus-lg me-1"></i>Thêm
                                        </button>
                                    </div>
                                </div>

                                <div class="table-responsive">
                                    <table class="table table-dark table-hover align-middle border-secondary" id="booksTable">
                                        <thead>
                                            <tr>
                                                <th>Tên Truyện</th>
                                                <th>Số Lượng</th>
                                                <th>Tiền Cọc (1 Cuốn)</th>
                                                <th>Phí Thuê (1 Cuốn)</th>
                                                <th>Thành Tiền</th>
                                                <th class="text-center">Hành động</th>
                                            </tr>
                                        </thead>
                                        <tbody id="booksTbody">
                                            <!-- Sách được thêm bằng JS sẽ hiển thị ở đây -->
                                        </tbody>
                                        <tfoot>
                                            <tr>
                                                <td colspan="4" class="text-end fw-bold">Tổng Thanh Toán (Sẽ trừ vào ví):</td>
                                                <td colspan="2" class="text-warning fw-bold fs-5" id="totalAmount">0 đ</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-end mt-2 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold" id="btnResetForm">
                        <i class="bi bi-arrow-counterclockwise me-2"></i> ĐẶT LẠI
                    </button>
                    <button type="button" class="btn btn-primary rounded-pill px-5 py-2 fw-bold" id="btnSubmitForm">
                        TẠO ĐƠN MƯỢN TRỰC TIẾP <i class="bi bi-check2-circle ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>

<!-- jQuery and Select2 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:src="@{/js/direct-borrow.js}"></script>
</body>
</html>

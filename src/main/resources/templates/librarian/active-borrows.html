<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Sách đang được mượn | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .admin-header-waka {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
        .row-overdue {
            background: rgba(231, 76, 60, 0.05) !important;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='activeborrows')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0">Tất cả truyện đang được mượn</h3>
            </div>

            <div class="table-responsive">
                <table class="table table-waka align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">STT</th>
                            <th>Người dùng</th>
                            <th class="text-center">Số lượng truyện mượn</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data, iterStat : ${borrowDataMap}" th:classappend="${data.get('isOverdue') ? 'row-overdue' : ''}">
                            <td th:text="${iterStat.count}" class="text-secondary"></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="ms-0">
                                        <div class="fw-bold text-light" th:text="${data.get('borrow').user != null ? data.get('borrow').user.fullName : 'N/A'}"></div>
                                        <small class="text-secondary" th:text="${data.get('borrow').user != null ? data.get('borrow').user.userName : ''}"></small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-dark border border-secondary text-info px-3 py-2" th:text="${data.get('itemCount')} + ' cuốn'"></span>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-outline-info btn-sm rounded-pill px-4 fw-bold"
                                        th:onclick="'showBorrowDetail(' + ${iterStat.index} + ')'">
                                    CHI TIẾT
                                </button>
                                <form th:action="@{/librarian/returns/{id}(id=${data.get('borrow').id})}" method="post" class="d-inline ms-2">
                                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-info btn-sm rounded-pill px-4 fw-bold" onclick="return confirm('Xử lý trả tất cả truyện trong đơn này?');">TRẢ NHANH</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#maps.isEmpty(borrowDataMap)}">
                            <td colspan="4" class="text-center py-5 text-secondary">Không có truyện nào đang được mượn.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Chi tiết đơn mượn #<span id="modalTransactionId"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="p-3 bg-black border-bottom border-secondary border-opacity-25">
                    <div class="row">
                        <div class="col-md-6">
                            <p class="mb-1 small text-secondary fw-bold">NGƯỜI MƯỢN</p>
                            <p class="mb-0 fw-bold" id="modalUserName"></p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1 small text-secondary fw-bold">NGÀY MƯỢN</p>
                            <p class="mb-0" id="modalBorrowDate"></p>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead class="table-black">
                            <tr class="small text-secondary fw-bold">
                                <th class="ps-3">TÊN TRUYỆN</th>
                                <th>NGÀY MƯỢN</th>
                                <th>HẠN TRẢ</th>
                                <th class="text-end pe-3">TIỀN PHẠT</th>
                            </tr>
                        </thead>
                        <tbody id="modalItemsTable">
                            <!-- Items will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <div class="me-auto text-danger fw-bold" id="modalTotalFine"></div>
                <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    const borrowData = [[${borrowDataMap}]];

    function showBorrowDetail(index) {
        const data = borrowData[index];
        const borrow = data.borrow;
        const modal = new bootstrap.Modal(document.getElementById('detailModal'));
        
        document.getElementById('modalTransactionId').innerText = borrow.id;
        document.getElementById('modalUserName').innerText = borrow.user ? borrow.user.fullName : 'N/A';
        
        // Format dates
        const bDate = new Date(borrow.borrowDate);
        document.getElementById('modalBorrowDate').innerText = bDate.toLocaleDateString('vi-VN');
        
        // Render items
        const tbody = document.getElementById('modalItemsTable');
        tbody.innerHTML = '';
        
        borrow.items.forEach(item => {
            const dueDate = new Date(borrow.dueDate);
            const isOverdue = data.isOverdue;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ps-3">
                    <div class="fw-bold text-info">${item.book.title}</div>
                    <small class="text-secondary">ISBN: ${item.book.isbn || 'N/A'}</small>
                </td>
                <td>${bDate.toLocaleDateString('vi-VN')}</td>
                <td class="${isOverdue ? 'text-danger fw-bold' : ''}">${dueDate.toLocaleDateString('vi-VN')}</td>
                <td class="text-end pe-3 ${isOverdue ? 'text-danger fw-bold' : 'text-secondary'}">
                    ${isOverdue ? formatCurrency(data.lateFine) : '0 VND'}
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        document.getElementById('modalTotalFine').innerText = data.isOverdue ? 'Tổng tiền phạt: ' + formatCurrency(data.lateFine) : '';
        
        modal.show();
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }
</script>

</body>
</html>

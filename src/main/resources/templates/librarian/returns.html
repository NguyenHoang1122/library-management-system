<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Quản lý trả sách</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/sidebar :: common_sidebar('returns')"></div>
<div class="container mt-4">
  <h2>Quản lý trả sách</h2>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Người dùng</th>
      <th>Sách</th>
      <th>Ngày mượn</th>
      <th>Ngày trả dự kiến</th>
      <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="borrow : ${activeBorrows}">
      <td th:text="${borrow.id}"></td>
      <td th:text="${borrow.user.fullName}"></td>
      <td th:text="${borrow.borrowItems[0].book.title}"></td>
      <td th:text="${#temporals.format(borrow.borrowDate, 'dd/MM/yyyy')}"></td>
      <td th:text="${#temporals.format(borrow.dueDate, 'dd/MM/yyyy')}"></td>
      <td>
        <form th:action="@{/librarian/returns/{id}(id=${borrow.id})}" method="post">
          <button type="submit" class="btn btn-primary btn-sm">Xử lý trả sách</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>

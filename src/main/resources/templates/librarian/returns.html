<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Quản lý trả truyện</title>
  <div th:replace="~{layout :: header_head}"></div>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
  <div class="row">
    <!-- SIDEBAR -->
    <div class="col-md-3 col-lg-2 mb-4">
      <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='returns')}"></div>
    </div>

    <!-- CONTENT -->
    <div class="col-md-9 col-lg-10">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <h3 class="mb-0 text-primary">
            <i class="bi bi-arrow-return-left"></i> Quản lý trả truyện
          </h3>
        </div>
        <div class="card-body p-4">
          <!-- Thông báo thành công/lỗi -->
          <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <table class="table table-striped">
            <thead>
            <tr>
              <th>ID</th>
              <th>Người dùng</th>
              <th>Danh sách truyện</th>
              <th>Ngày mượn</th>
              <th>Ngày trả dự kiến</th>
              <th>Trạng thái</th>
              <th>Tiền phạt</th>
              <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="data : ${borrowDataMap}"
                th:classappend="${data.get('isOverdue') ? 'table-danger' : ''}">
              <td th:text="${data.get('borrow').id}"></td>
              <td th:text="${data.get('borrow').user.fullName}"></td>
              <td>
                <span th:if="${data.get('borrow').borrowItems != null && !data.get('borrow').borrowItems.isEmpty()}">
                  <span th:each="item : ${data.get('borrow').borrowItems}"
                        th:text="${item.book.title}" class="badge bg-info me-1"></span>
                </span>
                <span th:if="${data.get('borrow').borrowItems == null || data.get('borrow').borrowItems.isEmpty()}">N/A</span>
              </td>
              <td th:text="${#temporals.format(data.get('borrow').borrowDate, 'dd/MM/yyyy')}"></td>
              <td th:text="${#temporals.format(data.get('borrow').dueDate, 'dd/MM/yyyy')}"></td>
              <td>
                <span th:if="${data.get('isOverdue')}" class="badge bg-danger">
                  <i class="bi bi-exclamation-triangle"></i> Quá hạn
                </span>
                <span th:unless="${data.get('isOverdue')}" class="badge bg-success">
                  <i class="bi bi-check-circle"></i> Bình thường
                </span>
              </td>
              <td>
                <span th:if="${data.get('isOverdue')}" th:text="${#numbers.formatCurrency(data.get('lateFine'))}"></span>
                <span th:unless="${data.get('isOverdue')}">0 VND</span>
              </td>
              <td>
                <form th:action="@{/librarian/returns/{id}(id=${data.get('borrow').id})}" method="post" style="display:inline;">
                  <button type="submit" class="btn btn-primary btn-sm" onclick="return confirmReturn(this);">
                    Xử lý trả
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function confirmReturn(button) {
    const row = button.closest('tr');
    const isOverdue = row.classList.contains('table-danger');
    const message = isOverdue
            ? 'Sách quá hạn! Xác nhận trả và tính phí?'
            : 'Xác nhận xử lý trả sách?';
    return confirm(message);
  }
</script>
</body>
</html>

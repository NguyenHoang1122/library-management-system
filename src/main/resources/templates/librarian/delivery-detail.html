<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Chi Tiết Giao Truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/librarian-borrow-detail.css}">
</head>
<body style="background-color: #121212; color: #e0e0e0;">
<div th:replace="~{layout :: header}"></div>

<div class="container my-5" style="min-height: 60vh;">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
        <h4 class="fw-bold text-success"><i class="bi bi-truck me-2"></i>Chi Tiết Giao Truyện #<span th:text="${request.id}"></span></h4>
        <a th:href="@{/librarian/deliveries}" class="btn btn-outline-info rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i>Quay lại danh sách</a>
    </div>

    <div class="row">
        <!-- Cột trái: Danh sách truyện -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-3 mb-4 cart-card text-light">
                <div class="card-header border-bottom border-secondary py-3" style="background-color: transparent;">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-book me-2 text-info"></i>Danh sách truyện gửi</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-dark table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col" class="ps-4">Tên truyện</th>
                                    <th scope="col" class="text-center">Số lượng</th>
                                    <th scope="col" class="text-end pe-4">Giá cọc</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${request.borrowRequestItems}">
                                    <td class="ps-4 py-3 border-secondary">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${item.book.image}" alt="Cover" class="rounded me-3 shadow-sm book-cover-img">
                                            <div>
                                                <h6 class="mb-1 fw-bold text-light" th:text="${item.book.title}">Tên truyện</h6>
                                                <span class="badge bg-secondary" th:text="${item.book.author != null ? item.book.author.name : 'Đang cập nhật'}">Tác giả</span>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-center fw-medium border-secondary" th:text="${item.quantity}">1</td>
                                    <td class="text-end pe-4 fw-medium text-warning border-secondary">
                                        <span th:text="${#numbers.formatDecimal((item.book.depositPrice != null ? item.book.depositPrice : 0) * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Thông tin đơn -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 mb-4 cart-card text-light">
                <div class="card-header border-bottom border-secondary py-3" style="background-color: transparent;">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-info-circle me-2 text-info"></i>Thông tin chung</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3 d-flex justify-content-between border-bottom border-secondary pb-2">
                        <span class="text-secondary">Khách hàng:</span>
                        <span class="fw-bold text-info" th:text="${request.user.fullName}">Tên KH</span>
                    </div>
                    <div class="mb-3 d-flex justify-content-between border-bottom border-secondary pb-2">
                        <span class="text-secondary">Trạng thái:</span>
                        <span class="badge bg-primary">Đang giao / Chờ nhận</span>
                    </div>
                    <div class="mb-3">
                        <span class="text-secondary d-block mb-1">Giao hàng:</span>
                        <span class="fw-medium text-info">
                            <i class="bi bi-truck me-1"></i>
                            <span th:text="${request.deliveryMethod != null and request.deliveryMethod.name() == 'SHIPPING' ? 'Giao tận nơi' : 'Nhận tại thư viện'}">Nhận tại thư viện</span>
                        </span>
                        <div th:if="${request.deliveryMethod != null and request.deliveryMethod.name() == 'SHIPPING'}" class="small text-light mt-2 p-2 rounded border border-secondary" style="background-color: #222;">
                            <i class="bi bi-geo-alt text-danger me-1"></i> <span th:text="${request.shippingAddress}">Địa chỉ</span>
                        </div>
                    </div>
                    <div th:if="${request.note != null and !request.note.isEmpty()}" class="mb-3">
                        <span class="text-secondary d-block mb-1">Ghi chú:</span>
                        <span class="small p-2 rounded border border-secondary d-block text-light" style="background-color: #222;" th:text="${request.note}"></span>
                    </div>
                </div>
            </div>

            <!-- Nút hành động -->
            <div th:if="${request.requestStatus.name() == 'APPROVED'}" class="mt-4 d-flex gap-2">
                <form id="rejectDeliveryForm" th:action="@{/librarian/deliveries/{id}/reject(id=${request.id})}" method="post" class="flex-grow-1">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="reason" id="rejectReasonInput" value="">
                    <button type="button" class="btn btn-outline-danger w-100 fw-bold rounded-pill shadow-sm" th:onclick="'confirmRejectDelivery(' + ${request.id} + ')'">
                        <i class="bi bi-x-circle me-1"></i> Hủy đơn
                    </button>
                </form>
                <form id="completeDeliveryForm" th:action="@{/librarian/deliveries/{id}/complete(id=${request.id})}" method="post" class="flex-grow-1">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="button" class="btn btn-success w-100 fw-bold rounded-pill shadow-sm" th:onclick="'confirmCompleteDelivery(' + ${request.id} + ')'">
                        <i class="bi bi-check-circle me-1"></i> Hoàn thành đơn
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/librarian-delivery-detail.js}"></script>
</body>
</html>

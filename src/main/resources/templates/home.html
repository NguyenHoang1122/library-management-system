<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang chủ | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<div class="container-fluid px-5 mt-4">
    <!-- Sách mới mỗi ngày -->
    <section class="mb-5">
        <h2 class="section-title">Truyện mới mỗi ngày <span>- Cập nhật liên tục</span></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div th:each="book : ${newestBooks}" class="col">
                <a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none text-white">
                    <div class="book-card">
                        <div class="book-img-container">
                            <img th:src="${book.image}" class="book-img" th:alt="${book.title}">
                            <span th:if="${book.quantity > 0}" class="badge-waka">Truyện Mới</span>
                            <span th:if="${book.quantity <= 0}" class="badge-waka bg-danger">Hết Hàng</span>
                        </div>
                        <div class="book-title" th:text="${book.title}"></div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Bảng xếp hạng (Sách Hot) -->
    <section class="mb-5">
        <h2 class="section-title">Bảng xếp hạng truyện <span>- Được đọc nhiều nhất</span></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div th:each="book, iterStat : ${hotBooks}" class="col">
                <a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none text-white">
                    <div class="book-card">
                        <div class="book-img-container" style="margin-left: 20px;">
                            <img th:src="${book.image}" class="book-img" th:alt="${book.title}">
                            <span th:if="${book.quantity > 0}" class="badge-waka">HOT</span>
                            <span th:if="${book.quantity <= 0}" class="badge-waka bg-danger">Hết Hàng</span>
                            <div class="rank-number" th:text="${iterStat.count}">1</div>
                        </div>
                        <div class="book-title" style="margin-left: 20px;" th:text="${book.title}"></div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Thể loại Tu tiên -->
    <section class="mb-5" th:if="${not #lists.isEmpty(tuTienBooks)}">
        <h2 class="section-title">Thể loại Tu tiên <span>- Thế giới huyền ảo</span></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div th:each="book : ${tuTienBooks}" class="col">
                <a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none text-white">
                    <div class="book-card">
                        <div class="book-img-container">
                            <img th:src="${book.image}" class="book-img" th:alt="${book.title}">
                            <span th:if="${book.quantity <= 0}" class="badge-waka bg-danger">Hết Hàng</span>
                        </div>
                        <div class="book-title" th:text="${book.title}"></div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Thể loại Truyện teen -->
    <section class="mb-5" th:if="${not #lists.isEmpty(truyenTeenBooks)}">
        <h2 class="section-title">Thể loại Truyện teen <span>- Tuổi trẻ sôi nổi</span></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div th:each="book : ${truyenTeenBooks}" class="col">
                <a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none text-white">
                    <div class="book-card">
                        <div class="book-img-container">
                            <img th:src="${book.image}" class="book-img" th:alt="${book.title}">
                            <span th:if="${book.quantity <= 0}" class="badge-waka bg-danger">Hết Hàng</span>
                        </div>
                        <div class="book-title" th:text="${book.title}"></div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Thể loại Xuyên không -->
    <section class="mb-5" th:if="${not #lists.isEmpty(xuyenKhongBooks)}">
        <h2 class="section-title">Thể loại Xuyên không <span>- Hành trình vượt thời không</span></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div th:each="book : ${xuyenKhongBooks}" class="col">
                <a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none text-white">
                    <div class="book-card">
                        <div class="book-img-container">
                            <img th:src="${book.image}" class="book-img" th:alt="${book.title}">
                            <span th:if="${book.quantity <= 0}" class="badge-waka bg-danger">Hết Hàng</span>
                        </div>
                        <div class="book-title" th:text="${book.title}"></div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</div>

<div th:replace="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách sách</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container-fluid my-5 px-4">
    <div class="row">
        <!--SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='books')}"></div>
        </div>

        <!-- (DANH SÁCH SÁCH) -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary"><i class="bi bi-journal-text"></i> Danh sách sách</h3>
                    <!-- Nút thêm sách nhanh -->
                    <div sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                        <a th:href="@{/books/add}" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Thêm sách mới
                        </a>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Tìm kiếm -->
                    <form th:action="@{/books}" method="get" class="mb-4">
                        <div class="row g-2">
                            <div class="col-md-10">
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                    <input type="text" name="title" class="form-control"
                                           placeholder="Tìm kiếm theo tiêu đề sách..." th:value="${param.title}">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" type="submit">Tìm kiếm</button>
                            </div>
                        </div>
                    </form>

                    <!-- Thông báo thành công/lỗi -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Bảng danh sách -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tiêu đề</th>
                                <th>Tác giả</th>
                                <th>Danh mục</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="book : ${books}">
                                <td th:text="${book.id}" class="fw-bold text-muted"></td>
                                <td>
                                    <a th:href="@{/books/{id}(id=${book.id})}"
                                       th:text="${book.title}" class="text-decoration-none fw-bold text-dark"></a>
                                </td>
                                <td th:text="${book.author?.name} ?: 'N/A'"></td>
                                <td>
                                    <span th:if="${book.categories != null and !book.categories.isEmpty()}"
                                          th:each="cat : ${book.categories}" class="badge bg-info text-dark me-1"
                                          th:text="${cat.categoryName}"></span> <span
                                        th:if="${book.categories == null or book.categories.isEmpty()}"
                                        class="text-muted">N/A</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-outline-info btn-sm"
                                           title="Xem chi tiết">
                                            <i class="bi bi-eye"></i> Xem chi tiết
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- Hiển thị nếu danh sách trống -->
                            <tr th:if="${#lists.isEmpty(books)}">
                                <td colspan="6" class="text-center py-4 text-muted">Không tìm thấy cuốn sách nào.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

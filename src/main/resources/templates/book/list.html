<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .admin-header-waka {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .search-box-waka {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 5px 20px;
            display: flex;
            align-items: center;
        }
        .search-box-waka input {
            background: transparent;
            border: none;
            color: #fff;
            box-shadow: none;
        }
        .table-waka {
            color: #ccc;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-waka thead {
            background: #252525;
            color: #16a085;
        }
        .table-waka th, .table-waka td {
            padding: 15px;
            border-color: #333;
        }
        .table-waka tbody tr:hover {
            background: rgba(22, 160, 133, 0.05);
        }
        .btn-add-waka {
            background: #16a085;
            color: #fff;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-add-waka:hover {
            background: #1abc9c;
            color: #fff;
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='books')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0">Quản lý truyện</h3>
                <div sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a th:href="@{/books/add}" class="btn-add-waka">
                        <i class="bi bi-plus-circle me-2"></i>Thêm truyện mới
                    </a>
                </div>
            </div>

            <!-- Search Area -->
            <form th:action="@{/books/search}" method="get" class="mb-4">
                <div class="search-box-waka">
                    <i class="bi bi-search text-secondary me-2"></i>
                    <input type="text" name="query" class="form-control" placeholder="Tìm kiếm theo tên truyện hoặc tác giả..." th:value="${searchQuery ?: param.query}">
                    <button type="submit" class="btn btn-link text-info p-0 ms-2 text-decoration-none fw-bold">TÌM</button>
                </div>
            </form>

            <!-- Table Area -->
            <div class="table-responsive">
                <table class="table table-waka">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề</th>
                            <th>Tác giả</th>
                            <th>Danh mục</th>
                            <th>Số lượng</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}" class="text-secondary"></td>
                            <td>
                                <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}" class="text-decoration-none fw-bold text-light"></a>
                            </td>
                            <td th:text="${book.author?.name} ?: 'N/A'"></td>
                            <td>
                                <span th:each="cat : ${book.categories}" class="badge bg-dark border border-secondary text-info me-1" th:text="${cat.categoryName}"></span>
                            </td>
                            <td>
                                <span th:text="${book.quantity}" th:class="${book.quantity <= 0 ? 'text-danger fw-bold' : ''}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-outline-info btn-sm rounded-pill px-3">Chi tiết</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="5" class="text-center py-5 text-secondary">Không tìm thấy cuốn truyện nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

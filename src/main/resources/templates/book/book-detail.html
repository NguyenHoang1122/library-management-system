<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết sách</title>
    <div th:replace="~{layout :: header_head}"></div>
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="container mt-4">
    <h2 th:text="'Chi tiết sách: ' + ${book.title}"></h2>
    <div class="row">
        <div class="col-md-4">
            <img th:if="${book.image}" th:src="${book.image}" alt="Ảnh sách" class="img-fluid">
            <p th:if="${!book.image}">Không có ảnh</p>
        </div>
        <div class="col-md-8">
            <p><strong>Mô tả:</strong> <span th:text="${book.description} ?: 'N/A'"></span></p>
            <p><strong>ISBN:</strong> <span th:text="${book.isbn} ?: 'N/A'"></span></p>
            <p><strong>Năm xuất bản:</strong> <span th:text="${book.publishYear} ?: 'N/A'"></span></p>
            <p><strong>Tác giả:</strong> <span th:text="${book.author?.name} ?: 'N/A'"></span></p>
            <p><strong>Danh mục:</strong> <span th:text="${book.category?.categoryName} ?: 'N/A'"></span></p>
            <p><strong>Tổng số bản sao:</strong> <span th:text="${book.totalCopies}"></span></p>
            <p><strong>Số bản sao khả dụng:</strong> <span th:text="${book.availableCopies}"></span></p>
        </div>
    </div>
    <a th:href="@{/books}" class="btn btn-secondary">Quay lại danh sách</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

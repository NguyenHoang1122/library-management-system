<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/book-user-list.css}">
</head>
<body>
<!-- Nhúng CSS sidebar -->
<style th:replace="~{fragments/sidebar :: sidebar_styles}"></style>

<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='books')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="user-header-waka">
                <h3 class="mb-0 text-white fw-bold">
                    <span th:if="${param.category != null}">
                        <th:block th:each="cat : ${categories}" th:if="${#strings.equals(cat.id, param.category)}">
                            <span th:text="'Thể loại: ' + ${cat.categoryName}">Danh mục</span>
                        </th:block>
                    </span>
                    <span th:if="${param.category == null and searchQuery == null}">Thư viện truyện</span>
                    <span th:if="${searchQuery != null}" th:text="'Kết quả tìm kiếm cho: &quot;' + ${searchQuery} + '&quot;'">Tìm kiếm</span>
                </h3>
            </div>

            <!-- Search & Sort Area -->
            <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between mb-4">
                <form th:action="@{/books/search}" method="get" class="flex-grow-1 mb-0">
                    <div class="search-box-waka">
                        <i class="bi bi-search text-secondary me-2"></i>
                        <input type="text" name="query" class="form-control" placeholder="Tìm kiếm truyện hoặc tác giả mà bạn muốn mượn..." th:value="${searchQuery ?: param.query}">
                        <button type="submit" class="btn btn-link text-info p-0 ms-2 text-decoration-none fw-bold" style="color: #14b4a0 !important;">TÌM KIẾM</button>
                    </div>
                </form>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-secondary small fw-bold text-nowrap">Sắp xếp:</span>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary btn-sm rounded-pill dropdown-toggle px-3 text-light border-secondary" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:if="${sortBy == 'author'}"><i class="bi bi-person me-1"></i> Tác giả</span>
                            <span th:if="${sortBy == 'category'}"><i class="bi bi-tags me-1"></i> Danh mục</span>
                            <span th:if="${sortBy == 'quantity'}"><i class="bi bi-box me-1"></i> Số lượng</span>
                            <span th:if="${sortBy == null or sortBy == ''}"><i class="bi bi-funnel me-1"></i> Mặc định</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, sortBy='', category=${category})}">Mặc định</a></li>
                            <li><a class="dropdown-item" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, sortBy='author', category=${category})}">Tác giả</a></li>
                            <li><a class="dropdown-item" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, sortBy='category', category=${category})}">Danh mục</a></li>
                            <li><a class="dropdown-item" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, sortBy='quantity', category=${category})}">Số lượng</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Book Grid -->
            <div th:if="${!books.isEmpty()}" class="book-grid">
                <div th:each="book : ${books}" class="waka-card">
                    <div class="waka-img-container">
                        <img th:src="${book.image != null ? book.image : 'https://via.placeholder.com/200x300?text=No+Cover'}"
                             class="waka-img" th:alt="${book.title}">
                    </div>
                    
                    <!-- Content -->
                    <a th:href="@{/books/{id}(id=${book.id})}" class="waka-card-title" th:text="${book.title}">Tiêu đề truyện</a>
                    
                    <div class="author-text">
                        <i class="bi bi-person text-secondary"></i>
                        <span th:text="${book.author?.name} ?: 'Đang cập nhật'">Tác giả</span>
                    </div>

                    <div class="category-badges">
                        <span th:each="cat : ${book.categories}" class="cat-badge" th:text="${cat.categoryName}">Thể loại</span>
                    </div>

                    <div class="waka-card-actions">
                        <a th:href="@{/books/{id}(id=${book.id})}" class="btn-detail">
                            <i class="bi bi-info-circle me-1"></i> Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${books.isEmpty()}" class="text-center py-5">
                <i class="bi bi-journal-x" style="font-size: 4rem; color: #444;"></i>
                <p class="mt-3 text-secondary fs-5">Rất tiếc, không tìm thấy cuốn truyện nào phù hợp.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4" style="color: #14b4a0; border-color: #14b4a0;">Xem tất cả truyện</a>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-5">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, category=${category}, sortBy=${sortBy}, page=${currentPage - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:text="${i}" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, category=${category}, sortBy=${sortBy}, page=${i})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{${searchQuery != null ? '/books/search' : '/books'}(query=${searchQuery}, category=${category}, sortBy=${sortBy}, page=${currentPage + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

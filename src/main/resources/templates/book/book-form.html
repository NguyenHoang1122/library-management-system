<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${bookDTO.id != null} ? 'Sửa truyện' : 'Thêm truyện'"></title>
    <div th:replace="~{layout :: header_head}"></div>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!--SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='books')}"></div>
        </div>

        <!-- FORM -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h3 class="mb-0 text-primary" th:text="${bookDTO.id != null} ? 'Cập nhật thông tin truyện' : 'Thêm truyện mới'"></h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="${bookDTO.id != null ? '/books/update/' + bookDTO.id : '/books/save'}"
                          method="post"
                          enctype="multipart/form-data"
                          th:object="${bookDTO}">
                        <input type="hidden" th:field="*{id}" />
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Tiêu đề:</label>
                                <input type="text" th:field="*{title}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Mã truyện:</label>
                                <input type="text" th:field="*{isbn}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold">Mô tả:</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Năm xuất bản:</label>
                                <input type="date" th:field="*{publishYear}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Số lượng:</label>
                                <input type="number" th:field="*{quantity}" class="form-control" required min="1">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Ảnh:</label>
                                <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
                                <small class="form-text text-muted d-block mt-2" th:if="*{image}">
                                    <img th:src="*{image}" style="max-width: 80px; max-height: 80px; margin-right: 10px; border-radius: 4px;" alt="Ảnh hiện tại">
                                    <span>Ảnh hiện tại. Để trống nếu không muốn thay đổi.</span>
                                </small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold mb-2">Danh mục:</label>
                                <div class="form-control" style="height: auto; min-height: 38px; overflow-y: auto; max-height: 150px; background-color: #f8f9fa;">
                                    <div class="row px-2">
                                        <div th:each="cat : ${categories}" class="form-check col-6">
                                            <input class="form-check-input" type="checkbox"
                                                   th:field="*{categoryIds}"
                                                   th:value="${cat.id}"
                                                   th:id="'cat-' + ${cat.id}">
                                            <label class="form-check-label small" th:for="'cat-' + ${cat.id}" th:text="${cat.categoryName}"></label>
                                        </div>
                                    </div>
                                    <div th:if="${#lists.isEmpty(categories)}" class="text-muted small">Không có danh mục</div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Tác giả:</label>
                                <input type="text" th:field="*{authorName}" class="form-control" placeholder="Nhập tên tác giả">
                            </div>
                        </div>

                        <div class="mt-4 border-top pt-3">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Lưu thay đổi
                            </button>
                            <a th:href="@{/books}" class="btn btn-outline-secondary px-4 ms-2">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${bookDTO.id != null} ? 'Sửa sách' : 'Thêm sách'"></title>
    <div th:replace="~{layout :: header_head}"></div>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!--SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{admin/dashboard:: admin_sidebar(activePage='books')}"></div>
        </div>

        <!-- FORM -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h3 class="mb-0 text-primary" th:text="${bookDTO.id != null} ? 'Cập nhật thông tin sách' : 'Thêm sách mới'"></h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="${bookDTO.id != null ? '/books/update/' + bookDTO.id : '/books/save'}"
                          method="post"
                          enctype="multipart/form-data"
                          th:object="${bookDTO}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Tiêu đề:</label>
                                <input type="text" th:field="*{title}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">ISBN:</label>
                                <input type="text" th:field="*{isbn}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold">Mô tả:</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Năm xuất bản:</label>
                                <input type="date" th:field="*{publishYear}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Tổng số bản sao:</label>
                                <input type="number" th:field="*{totalCopies}" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="fw-bold">Ảnh:</label>
                                <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Danh mục:</label>
                                <select th:field="*{categoryId}" class="form-select">
                                    <option value="">Chọn danh mục</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">Tác giả:</label>
                                <select th:field="*{authorId}" class="form-select">
                                    <option value="">Chọn tác giả</option>
                                    <option th:each="auth : ${authors}" th:value="${auth.id}" th:text="${auth.name}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 border-top pt-3">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Lưu thay đổi
                            </button>
                            <a th:href="@{/books}" class="btn btn-outline-secondary px-4 ms-2">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

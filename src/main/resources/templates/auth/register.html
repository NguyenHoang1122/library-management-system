<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký</title>
    <div th:replace="~{layout :: header_head}"></div>
    <style>
        .register-container {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .register-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input::placeholder {
            color: #999;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .success {
            color: #51cf66;
            margin: 10px 0;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: #0dcaf0;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-register:hover { background: #0abfd9; }
        .register-footer {
            text-align: center;
            margin-top: 20px;
        }
        .register-footer a {
            color: #0dcaf0;
            text-decoration: none;
        }
    </style>
</head>
<body class="bg-dark">

<div th:replace="~{layout :: header}"></div>

<main class="container">
    <div class="register-container">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm" th:action="@{/users/register}" method="post" th:object="${userDTO}">
            <div class="form-group">
                <input th:field="*{fullName}" placeholder="Họ tên" >
                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input th:field="*{userName}" placeholder="Tên đăng nhập" >
                <div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input th:field="*{email}" type="email" placeholder="Email" >
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input th:field="*{phoneNumber}" placeholder="Số điện thoại" >
                <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input th:field="*{address}" placeholder="Địa chỉ" >
                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input id="password" th:field="*{password}" type="password" placeholder="Mật khẩu" >
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
            </div>
            <div class="form-group">
                <input id="confirmPassword" type="password" placeholder="Xác nhận mật khẩu" >
                <div id="matchMessage" class="error-message">Mật khẩu xác nhận không khớp!</div>
            </div>
            <button type="submit" class="btn-register">Đăng ký</button>
        </form>

        <div class="register-footer">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const message = document.getElementById('matchMessage');

    function validatePassword() {
        if (password.value !== confirmPassword.value) {
            message.style.display = 'block';
            confirmPassword.setCustomValidity("Passwords Don't Match");
            return false;
        } else {
            message.style.display = 'none';
            confirmPassword.setCustomValidity('');
            return true;
        }
    }

    confirmPassword.onkeyup = validatePassword;
    password.onchange = validatePassword;

    form.onsubmit = function(e) {
        if (!validatePassword()) {
            e.preventDefault();
            alert("Vui lòng kiểm tra lại mật khẩu xác nhận!");
        }
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-dark">

<div th:replace="~{layout :: header}"></div>

<main class="container">
    <div class="login-container">
        <h2>Đăng nhập</h2>

        <form th:action="@{/perform_login}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Tên đăng nhập" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Mật khẩu" required>
            </div>
            <div th:if="${error}" class="error" th:text="${errorMsg ?: 'Tên đăng nhập hoặc mật khẩu không đúng'}"></div>
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="login-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:if="${bannedError}">
    Swal.fire({
        icon: 'warning',
        title: 'Tài khoản đã bị khóa',
        text: 'Tài khoản đã bị banner hãy liên hệ với admin để được hỗ trợ.',
        confirmButtonText: 'Đóng',
        confirmButtonColor: '#dc3545',
        background: '#181818',
        color: '#e0e0e0',
        customClass: {
            popup: 'border border-danger border-opacity-25 rounded-3'
        }
    });
</script>
</body>
</html>

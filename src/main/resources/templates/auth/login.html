<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <div th:replace="~{layout :: header_head}"></div>
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .login-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
        }
        .form-group input::placeholder {
            color: #999;
        }
        .error { color: #ff6b6b; margin: 10px 0; }
        .success { color: #51cf66; margin: 10px 0; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0dcaf0;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover { background: #0abfd9; }
        .login-footer {
            text-align: center;
            margin-top: 20px;
        }
        .login-footer a {
            color: #0dcaf0;
            text-decoration: none;
        }
    </style>
</head>
<body class="bg-dark">

<div th:replace="~{layout :: header}"></div>

<main class="container">
    <div class="login-container">
        <h2>Đăng nhập</h2>
        <div th:if="${error}" class="error" th:text="'Tên đăng nhập hoặc mật khẩu không đúng'"></div>

        <form th:action="@{/perform_login}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Tên đăng nhập" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="login-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

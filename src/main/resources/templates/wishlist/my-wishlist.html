<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách yêu thích</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-4">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='wishlist')}"></div>
        </div>

        <!-- WISHLIST CONTENT -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-primary">
                        <i class="bi bi-heart"></i> Danh sách yêu thích
                        <span class="badge bg-secondary ms-2" th:text="${totalWishlists}"></span>
                    </h3>
                    <div th:if="${totalWishlists > 0}">
                        <form th:action="@{/wishlist/clear-all}" method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc muốn xóa tất cả?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i> Xóa tất cả
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo -->
                    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i> <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Danh sách yêu thích -->
                    <div th:if="${totalWishlists > 0}">
                        <div class="row">
                            <div th:each="wishlist : ${wishlists}" class="col-md-6 col-lg-4 mb-4">
                                <div class="card h-100 shadow-sm border-0 wishlist-card">
                                    <!-- Ảnh sách -->
                                    <div style="height: 250px; overflow: hidden;">
                                        <img th:src="${wishlist.book.image != null ? wishlist.book.image : 'https://via.placeholder.com/300x400?text=Book+Cover'}"
                                             class="card-img-top" style="height: 100%; object-fit: cover; cursor: pointer;"
                                             th:onclick="|window.location.href='/books/${wishlist.book.id}'|"
                                             alt="Book Cover" />
                                    </div>

                                    <div class="card-body d-flex flex-column">
                                        <!-- Tiêu đề sách -->
                                        <h5 class="card-title text-truncate" th:title="${wishlist.book.title}">
                                            <a th:href="@{/books/{id}(id=${wishlist.book.id})}"
                                               th:text="${wishlist.book.title}"
                                               class="text-decoration-none text-dark"></a>
                                        </h5>

                                        <!-- Tác giả -->
                                        <p class="card-text text-muted small mb-2" th:if="${wishlist.book.author != null}">
                                            <i class="bi bi-person"></i> <span th:text="${wishlist.book.author.name}"></span>
                                        </p>

                                        <!-- Danh mục -->
                                        <p class="card-text mb-3" th:if="${wishlist.book.categories != null and !wishlist.book.categories.isEmpty()}">
                                            <span th:each="cat : ${wishlist.book.categories}" class="badge bg-info text-dark me-1"
                                                  th:text="${cat.categoryName}"></span>
                                        </p>

                                        <div class="mt-auto">
                                            <!-- Buttons -->
                                            <div class="btn-group w-100" role="group">
                                                <a th:href="@{/books/{id}(id=${wishlist.book.id})}"
                                                   class="btn btn-outline-info btn-sm" style="flex: 1;"
                                                   title="Xem chi tiết">
                                                    <i class="bi bi-eye"></i> Xem
                                                </a>
                                                <a th:href="@{/borrow/request/{id}(id=${wishlist.book.id})}"
                                                   class="btn btn-outline-primary btn-sm" style="flex: 1;"
                                                   title="Mượn sách">
                                                    <i class="bi bi-book"></i> Mượn
                                                </a>
                                                <form th:action="@{/wishlist/remove/{id}(id=${wishlist.id})}" method="post" class="d-inline" style="flex: 1;">
                                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100"
                                                            title="Xóa khỏi danh sách yêu thích"
                                                            onclick="return confirm('Xóa khỏi danh sách yêu thích?')">
                                                        <i class="bi bi-trash"></i> Xóa
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Danh sách trống -->
                    <div th:if="${totalWishlists == 0}" class="text-center py-5">
                        <i class="bi bi-heart" style="font-size: 3rem; color: #adb5bd;"></i>
                        <p class="text-muted mt-3">Danh sách yêu thích của bạn trống</p>
                        <a th:href="@{/books}" class="btn btn-primary mt-3">
                            <i class="bi bi-book"></i> Xem danh sách sách
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

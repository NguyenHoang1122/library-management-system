<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách yêu thích | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/my-wishlist.css}">
</head>
<body>
<style th:replace="~{fragments/sidebar :: sidebar_styles}"></style>

<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar - Đồng bộ cấu trúc -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='wishlist')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Page Header -->
            <div class="mb-4 pb-3 border-bottom border-secondary d-flex align-items-center">
                <h3 class="mb-0 text-light fw-bold"><i class="bi bi-heart-fill me-2 text-warning"></i> Truyện yêu thích</h3>
            </div>
            <div class="filter-btns">
                <span class="text-secondary small">Bạn có <span class="text-light fw-bold" th:text="${totalWishlists}">0</span> truyện trong danh sách</span>
                <form th:if="${totalWishlists >
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> 0}" th:action="@{/wishlist/clear-all}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 btn-clear-all" style="font-size: 0.75rem;">
                        <i class="bi bi-trash3"></i> Xóa tất cả
                    </button>
                </form>
            </div>

            <!-- Content Area -->
            <div th:if="${totalWishlists == 0}" class="text-center py-5">
                <i class="bi bi-heart-break" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa có truyện yêu thích nào.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Khám phá ngay</a>
            </div>

            <div th:if="${totalWishlists > 0}" class="book-grid">
                <div th:each="wishlist : ${wishlists}" class="waka-card">
                    <a th:href="@{/books/{id}(id=${wishlist.book.id})}" class="text-decoration-none">
                        <div class="waka-img-container">
                            <img th:src="${wishlist.book.image != null ? wishlist.book.image : 'https://via.placeholder.com/200x300?text=No+Image'}"
                                 class="waka-img" th:alt="${wishlist.book.title}">
                        </div>
                        <div class="waka-card-title text-light" th:text="${wishlist.book.title}"></div>
                    </a>

                    <div class="waka-card-actions">
                        <!-- Nút Mượn/Đang mượn/Đang chờ duyệt -->
                        <th:block th:if="${borrowedBookIds != null and #lists.contains(borrowedBookIds, wishlist.book.id)}">
                            <button class="btn btn-secondary btn-action-sm disabled" style="flex: 2;">Đang mượn</button>
                        </th:block>
                        <th:block th:if="${!(borrowedBookIds != null and #lists.contains(borrowedBookIds, wishlist.book.id)) and pendingBookIds != null and #lists.contains(pendingBookIds, wishlist.book.id)}">
                            <button class="btn btn-secondary btn-action-sm disabled" style="flex: 2;">Đang chờ duyệt</button>
                        </th:block>
                        <th:block th:unless="${(borrowedBookIds != null and #lists.contains(borrowedBookIds, wishlist.book.id)) or (pendingBookIds != null and #lists.contains(pendingBookIds, wishlist.book.id))}">
                            <button type="button" class="btn btn-info btn-action-sm w-100 btn-borrow" 
                                    style="flex: 2;"
                                    data-bs-toggle="modal"
                                    data-bs-target="#borrowModal"
                                    th:data-id="${wishlist.book.id}"
                                    th:data-name="${wishlist.book.title}"
                                    onclick="prepareBorrowModal(this)">
                                <i class="bi bi-book"></i> Mượn
                            </button>
                        </th:block>

                        <!-- Nút Xóa -->
                        <form th:action="@{/wishlist/remove/${wishlist.id}}" method="post" style="flex: 1;">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-danger btn-action-sm w-100 btn-delete-wishlist">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal mượn truyện -->
<div class="modal fade" id="borrowModal" tabindex="-1" aria-labelledby="borrowModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="borrowModalLabel">Yêu cầu mượn truyện</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3 text-center">
                    <h6 class="text-info" id="modalBorrowBookName"></h6>
                    <p class="small text-secondary">Bạn đang gửi yêu cầu mượn cuốn truyện này.</p>
                </div>
                <div class="mb-3">
                    <label for="borrowNote" class="form-label">Ghi chú (tùy chọn)</label>
                    <textarea class="form-control bg-black text-light border-secondary" id="borrowNote" rows="3" placeholder="Nhập lời nhắn cho thủ thư..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-waka-primary" id="confirmBorrowBtn">Xác nhận mượn</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<script th:src="@{/js/my-wishlist.js}"></script>
</body>
</html>

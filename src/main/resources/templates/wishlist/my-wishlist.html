<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách yêu thích | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/my-wishlist.css}">
</head>
<body>
<style th:replace="~{fragments/sidebar :: sidebar_styles}"></style>

<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar - Đồng bộ cấu trúc -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='wishlist')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <!-- Main Tabs - Đồng bộ giao diện tab -->
            <div class="waka-tabs-main">
                <a th:href="@{/borrow/active}" class="waka-tab-item">Đang mượn</a>
                <a href="#" class="waka-tab-item active">Yêu thích</a>
                <a th:href="@{/borrow/history}" class="waka-tab-item">Lịch sử</a>
            </div>

            <!-- Action Bar -->
            <div class="filter-btns">
                <span class="text-secondary small">Bạn có <span class="text-light fw-bold" th:text="${totalWishlists}">0</span> truyện trong danh sách</span>
                <form th:if="${totalWishlists > 0}" th:action="@{/wishlist/clear-all}" method="post" onsubmit="return confirm('Xóa tất cả khỏi danh sách yêu thích?')">
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" style="font-size: 0.75rem;">
                        <i class="bi bi-trash3"></i> Xóa tất cả
                    </button>
                </form>
            </div>

            <!-- Content Area -->
            <div th:if="${totalWishlists == 0}" class="text-center py-5">
                <i class="bi bi-heart-break" style="font-size: 4rem; color: #333;"></i>
                <p class="mt-3 text-secondary">Bạn chưa có truyện yêu thích nào.</p>
                <a th:href="@{/books}" class="btn btn-outline-info btn-sm rounded-pill px-4">Khám phá ngay</a>
            </div>

            <div th:if="${totalWishlists > 0}" class="book-grid">
                <div th:each="wishlist : ${wishlists}" class="waka-card">
                    <div class="waka-img-container" th:onclick="|window.location.href='/books/${wishlist.book.id}'|" style="cursor: pointer;">
                        <img th:src="${wishlist.book.image != null ? wishlist.book.image : 'https://via.placeholder.com/200x300?text=No+Image'}"
                             class="waka-img" th:alt="${wishlist.book.title}">
                    </div>

                    <div class="waka-card-title" th:text="${wishlist.book.title}"></div>

                    <div class="waka-card-actions">
                        <!-- Nút Mượn/Đang mượn -->
                        <th:block th:if="${borrowedBookIds != null and #lists.contains(borrowedBookIds, wishlist.book.id)}">
                            <button class="btn btn-secondary btn-action-sm disabled" style="flex: 2;">Đang mượn</button>
                        </th:block>
                        <th:block th:unless="${borrowedBookIds != null and #lists.contains(borrowedBookIds, wishlist.book.id)}">
                            <a th:href="@{/borrow/request/${wishlist.book.id}}" class="btn btn-warning btn-action-sm" style="flex: 2;">
                                <i class="bi bi-book"></i> Mượn
                            </a>
                        </th:block>

                        <!-- Nút Xóa -->
                        <form th:action="@{/wishlist/remove/${wishlist.id}}" method="post" style="flex: 1;">
                            <button type="submit" class="btn btn-outline-danger btn-action-sm w-100" onclick="return confirm('Xóa khỏi yêu thích?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lịch sử nhập truyện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/import-history.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage=${activePage})}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka mb-4">
                <h3 class="mb-0"><i class="bi bi-clock-history me-2 text-warning"></i> Lịch sử nhập truyện</h3>
            </div>
            
            <div class="card shadow-sm card-waka rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-waka mb-0">
                            <thead>
                                <tr>
                                    <th class="text-center" width="5%">STT</th>
                                    <th width="30%">Tên truyện</th>
                                    <th class="text-center" width="15%">Số lượng</th>
                                    <th class="text-end" width="15%">Giá nhập</th>
                                    <th class="text-end" width="15%">Tổng tiền</th>
                                    <th class="text-center" width="20%">Ngày nhập</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="history, iterStat : ${historyPage.content}">
                                    <td class="text-center fw-bold align-middle" style="color: #6c757d;" th:text="${iterStat.count + (currentPage * 10)}">1</td>
                                    <td class="align-middle">
                                        <div class="book-title" th:text="${history.book.title}">Tên truyện</div>
                                    </td>
                                    <td class="text-center align-middle">
                                        <span class="badge bg-secondary text-light rounded-pill px-3 py-2" th:text="${history.importQuantity}">10</span>
                                    </td>
                                    <td class="text-end align-middle">
                                        <span th:text="${#numbers.formatDecimal(history.importPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                                    </td>
                                    <td class="text-end align-middle price-text">
                                        <span th:text="${#numbers.formatDecimal(history.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                                    </td>
                                    <td class="text-center align-middle" th:text="${#temporals.format(history.importDate, 'dd/MM/yyyy HH:mm')}">01/01/2023</td>
                                </tr>
                                <tr th:if="${historyPage.empty}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                        Chưa có lịch sử nhập truyện nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Phân trang -->
            <div class="mt-4 d-flex justify-content-center" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-custom">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/import-history(page=${currentPage - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                            th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/import-history(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/import-history(page=${currentPage + 1})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>

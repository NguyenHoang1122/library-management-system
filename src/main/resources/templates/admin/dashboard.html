<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Thống kê thư viện | Truyện 360</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container-fluid my-5 px-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='dashboard')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 px-5">
            <div class="admin-header-waka">
                <h3 class="mb-0"><i class="bi bi-bar-chart-fill me-2 text-warning"></i> Thống Kê Thư Viện</h3>
            </div>
            
            <!-- KPI Cards -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card shadow-sm card-waka border-start border-primary border-4 rounded-3 h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-2 text-secondary fw-bold">Tổng doanh thu dự kiến chưa trừ chi phí</h6>
                                <h3 class="fw-bold mb-0 text-primary" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</h3>
                            </div>
                            <i class="bi bi-cash-stack fs-1 text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm card-waka border-start border-success border-4 rounded-3 h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-2 text-secondary fw-bold">Doanh thu thực tế đã trừ chi phí</h6>
                                <h3 class="fw-bold mb-0 text-success" th:text="${#numbers.formatDecimal(actualRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</h3>
                            </div>
                            <i class="bi bi-wallet2 fs-1 text-success opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm card-waka border-start border-warning border-4 rounded-3 h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-2 text-secondary fw-bold">Tổng Users Đăng ký</h6>
                                <h3 class="fw-bold mb-0 text-warning" th:text="${totalUsers}">0</h3>
                            </div>
                            <i class="bi bi-people fs-1 text-warning opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-lg-6 mb-4">
                    <div class="card shadow-sm card-waka rounded-3 h-100">
                        <div class="card-header py-3 d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-0"><i class="bi bi-graph-up text-primary me-2"></i>Biểu đồ Doanh Thu</h6>
                            <select id="revenuePeriod" class="form-select form-select-sm w-auto">
                                <option value="day">Theo Ngày</option>
                                <option value="month">Theo Tháng</option>
                                <option value="year">Theo Năm</option>
                            </select>
                        </div>
                        <div class="card-body rounded-bottom" style="background: #121212;">
                            <canvas id="revenueChart" height="250"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 mb-4">
                    <div class="card shadow-sm card-waka rounded-3 h-100">
                        <div class="card-header py-3 d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-0"><i class="bi bi-person-lines-fill text-success me-2"></i>Biểu đồ User Đăng Ký Mới</h6>
                            <select id="usersPeriod" class="form-select form-select-sm w-auto">
                                <option value="day">Theo Ngày</option>
                                <option value="month">Theo Tháng</option>
                                <option value="year">Theo Năm</option>
                            </select>
                        </div>
                        <div class="card-body rounded-bottom" style="background: #121212;">
                            <canvas id="usersChart" height="250"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>

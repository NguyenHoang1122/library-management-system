<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <div th:replace="~{layout :: header_head}"></div>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="container my-5">
    <div class="row">
        <div class="col-md-12">
            <h2 class="text-white mb-4">Bảng điều khiển Admin</h2>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <div class="card bg-dark text-white">
                        <div class="card-body">
                            <h5 class="card-title">Quản lý người dùng</h5>
                            <a th:href="@{/admin/users}" class="btn btn-primary btn-sm">Xem danh sách</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-dark text-white">
                        <div class="card-body">
                            <h5 class="card-title">Quản lý thủ thư</h5>
                            <a th:href="@{/admin/librarians}" class="btn btn-primary btn-sm">Xem danh sách</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-dark text-white">
                        <div class="card-body">
                            <h5 class="card-title">Quản lý sách</h5>
                            <a th:href="@{/admin/books}" class="btn btn-primary btn-sm">Xem danh sách</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

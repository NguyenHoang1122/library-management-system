<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<div th:fragment="admin_sidebar">
    <div class="sidebar-admin">
        <h4 class="mb-4 text-primary"><i class="bi bi-speedometer2"></i> Admin Panel</h4>

        <div class="list-group shadow-sm">

            <a th:href="@{/user/profile}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:classappend="${activePage == 'profile' ? 'active' : ''}">
                <span><i class="bi bi-person me-2"></i> Hồ sơ cá nhân</span>
            </a>

            <a th:href="@{/users}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:classappend="${activePage == 'users' ? 'active' : ''}">
                <span><i class="bi bi-people me-2"></i> Người dùng</span>
            </a>

            <a th:href="@{/librarians}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:classappend="${activePage == 'librarians' ? 'active' : ''}">
                <span><i class="bi bi-person-badge me-2"></i> Thủ thư</span>
            </a>

            <a th:href="@{/books}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:classappend="${activePage == 'books' ? 'active' : ''}">
                <span><i class="bi bi-book me-2"></i> Quản lý sách</span>
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

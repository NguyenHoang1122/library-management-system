<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Từ Nhạy Cảm | Admin</title>
    <div th:replace="~{layout :: header_head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background-color: #121212; color: #e0e0e0;">
<div th:replace="~{layout :: header}"></div>

<div class="container-fluid my-5">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/sidebar :: common_sidebar(activePage='sensitive-words')}"></div>
        </div>
        <div class="col-md-9 col-lg-10 px-5">
            <h3 class="mb-4"><i class="bi bi-shield-lock text-danger me-2"></i>Quản lý Từ Nhạy Cảm</h3>

            <div class="card mb-4" style="background-color: #1e1e1e; border: 1px solid #333;">
                <div class="card-body">
                    <form th:action="@{/admin/sensitive-words/add}" method="post" class="d-flex gap-2">
                        <input type="text" name="word" class="form-control" style="background-color: #2a2a2a; color: white; border: 1px solid #444;" placeholder="Nhập từ nhạy cảm cần lọc..." required>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Thêm</button>
                    </form>
                </div>
            </div>

            <div class="card" style="background-color: #1e1e1e; border: 1px solid #333;">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Từ nhạy cảm</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="w : ${words}">
                                    <td th:text="${w.id}"></td>
                                    <td><span class="badge bg-danger fs-6" th:text="${w.word}"></span></td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/sensitive-words/delete/{id}(id=${w.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc muốn xóa từ này không?');">
                                            <i class="bi bi-trash"></i> Xóa
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(words)}">
                                    <td colspan="3" class="text-center text-muted">Chưa có dữ liệu.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
